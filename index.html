<!doctype html><html lang=he dir=rtl><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title></title><style>body{margin:0;background:#f4f4f5;font-family:Arial;direction:rtl}.b{background:white;margin:12px;padding:14px;border-radius:14px;border:1px solid #ddd}.t{white-space:pre-wrap;font-size:18px;line-height:1.75;color:#111}button{background:#000;color:white;border:0;border-radius:12px;padding:12px 18px;font-size:18px;font-weight:700;margin-bottom:10px}.ok{background:#166534}</style></head><body><script>const U='https://raw.githubusercontent.com/yanivmizrachiy/targilim/main/matarot-kurs-kayitz.html',C=String.fromCharCode(1492,1506,1514,1511),O=String.fromCharCode(1492,1493,1506,1514,1511);fetch(U).then(r=>r.text()).then(h=>{let d=new DOMParser().parseFromString(h,'text/html');[...d.querySelectorAll('.text-box')].forEach(x=>add(x.textContent.trim()))});function add(x){let e=document.createElement('section'),b=document.createElement('button'),p=document.createElement('div');e.className='b';p.className='t';p.textContent=x;b.textContent=C;b.onclick=async()=>{if(navigator.clipboard)await navigator.clipboard.writeText(x);else{let y=document.createElement('textarea');y.value=x;document.body.append(y);y.select();document.execCommand('copy');y.remove()}b.textContent=O;b.className='ok';setTimeout(()=>{b.textContent=C;b.className=''},1000)};e.append(b,p);document.body.append(e)}</script></body></html>
