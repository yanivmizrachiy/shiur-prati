<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff7a00">
<title>היום — שיעור פרטי</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
<header><div><div class="tag">ניהול פרטי</div><h1>היום</h1></div></header>
<main>
<section class="screen active">
<div class="hero"><h2 id="todayTitle">שיעורי היום</h2><p>כל הנתונים נקראים מהדפדפן הזה בלבד.</p></div>
<div id="stats" class="stats"></div>
<div class="card"><div class="head"><h3>שיעורים</h3><button id="openApp1" class="link">לאפליקציה</button></div><div id="lessons"></div></div>
<div class="card"><h3>תשלומים</h3><div id="payments"></div></div>
<div class="card"><h3>חובות פתוחים</h3><div id="debts"></div></div>
</section>
</main>
<nav>
<button id="homeBtn" class="nav active">בית</button>
<button id="appBtn" class="nav">אפליקציה</button>
</nav>
</div>
<script>
(()=>{
const KEY='shiur_prati_v1';
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const money=n=>`${Number(n||0).toLocaleString('he-IL')} ₪`;
const today=()=>new Date().toISOString().slice(0,10);
const dateHe=v=>{if(!v)return'';const d=new Date(v+'T00:00:00');return isNaN(d)?v:d.toLocaleDateString('he-IL')};
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'{}');return{students:Array.isArray(d.students)?d.students:[],lessons:Array.isArray(d.lessons)?d.lessons:[],payments:Array.isArray(d.payments)?d.payments:[]}}catch{return{students:[],lessons:[],payments:[]}}}
function studentName(db,id,fallback=''){return db.students.find(s=>s.studentId===id)?.fullName||fallback||'תלמיד לא נמצא'}
function calc(l){const due=Number(l.amountDue||0),paid=Number(l.amountPaid||0);return{due,paid,unpaid:Math.max(due-paid,0)}}
function stat(t,v){return`<div class="stat"><b>${v}</b><span>${esc(t)}</span></div>`}
function empty(t){return`<div class="empty">${esc(t)}</div>`}
function status(l){const c=calc(l);if(l.lessonStatus==='נקבע ועדיין לא התקיים')return'<span class="status orange">נקבע</span>';if(l.lessonStatus==='התקיים'&&c.unpaid===0)return'<span class="status green">שולם</span>';if(l.lessonStatus==='התקיים'&&c.unpaid>0)return`<span class="status red">חוב: ${money(c.unpaid)}</span>`;return`<span class="status orange">${esc(l.lessonStatus||'לא סומן')}</span>`}
function lessonItem(db,l){const c=calc(l);const duration=Number(l.durationMinutes||0)?` · ${Number(l.durationMinutes)} דקות`:'';return`<div class="item"><h3>${esc(studentName(db,l.studentId))}</h3><div class="meta">${dateHe(l.lessonDate)} ${l.lessonTime?'· '+esc(l.lessonTime):''}${duration}</div><div class="meta">סכום: ${money(c.due)} · שולם: ${money(c.paid)} · קבלה: ${esc(l.receiptStatus||'לא הוצאה קבלה')}</div>${status(l)}</div>`}
function paymentItem(db,p){const name=p.studentName||studentName(db,p.studentId,'');return`<div class="item"><h3>${esc(name)}</h3><div class="meta">${dateHe(p.paymentDate)} ${p.method?'· '+esc(p.method):''}</div><div class="meta">סכום: ${money(p.amount)} · נסגר: ${money(p.appliedAmount)} · יתרה: ${money(p.unappliedAmount)}</div></div>`}
function render(){const db=load();const d=today();$('#todayTitle').textContent='היום · '+dateHe(d);const todayLessons=db.lessons.filter(l=>l.lessonDate===d).sort((a,b)=>String(a.lessonTime||'').localeCompare(String(b.lessonTime||'')));const todayPayments=db.payments.filter(p=>p.paymentDate===d);const openDebts=db.lessons.filter(l=>l.lessonStatus==='התקיים'&&calc(l).unpaid>0);const sumDue=todayLessons.reduce((a,l)=>a+calc(l).due,0);const sumPaid=todayPayments.reduce((a,p)=>a+Number(p.amount||0),0);const debt=openDebts.reduce((a,l)=>a+calc(l).unpaid,0);$('#stats').innerHTML=[stat('שיעורים היום',todayLessons.length),stat('סכום היום',money(sumDue)),stat('תשלומים היום',money(sumPaid)),stat('חוב פתוח',money(debt))].join('');$('#lessons').innerHTML=todayLessons.length?todayLessons.map(l=>lessonItem(db,l)).join(''):empty('אין שיעורים להיום.');$('#payments').innerHTML=todayPayments.length?todayPayments.map(p=>paymentItem(db,p)).join(''):empty('אין תשלומים להיום.');$('#debts').innerHTML=openDebts.length?openDebts.map(l=>lessonItem(db,l)).join(''):empty('אין חובות פתוחים.');}
$('#openApp1').onclick=()=>location.href='./?v=today';$('#appBtn').onclick=()=>location.href='./?v=today';$('#homeBtn').onclick=()=>render();
render();
})();
</script>
</body>
</html>
