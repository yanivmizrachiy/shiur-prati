<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>תרגילים — מחולל תרגילי מתמטיקה</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
<header class="hdr"><div><h1>תרגילים</h1><div class="sub">מחולל תרגילי מתמטיקה — כיתות ז׳–ט׳</div></div><span class="badge" id="gradeBadge">כיתה ז׳</span></header>
<main>
<div class="card"><h2>הגדרות תרגיל</h2><div class="grid"><div><label for="sg">כיתה</label><select id="sg" onchange="onGrade()"><option value="7">כיתה ז׳</option><option value="8">כיתה ח׳</option><option value="9">כיתה ט׳</option></select></div><div><label for="sd">תחום</label><select id="sd" onchange="onDomain()"><option value="geometry">גאומטרי</option><option value="algebra">אלגברי</option><option value="numeric">מספרי</option><option value="uncertainty">אי-ודאות</option></select></div><div><label for="st">נושא</label><select id="st"></select></div><div><label for="sl">רמה</label><select id="sl"><option value="standard">סטנדרטית</option><option value="challenge">מאתגרת</option></select></div></div><button class="btn-gen" onclick="generate()">צור תרגיל ◀</button></div>
<div class="notice" id="g9notice"><strong>כיתה ט׳ — תוכנית לימודים קיימת, אך אין עדיין דוגמאות מקור.</strong><br>המחולל מייצר תרגילים רק מחומרי מקור שיניב העלה.</div>
<div id="out"><div class="empty">בחרו כיתה, תחום ונושא — ולחצו על ״צור תרגיל ◀״</div></div>
</main>
<script src="core.js"></script>
<script src="export.js"></script>
<script src="geo.js"></script>
<script src="algebra.js"></script>
<script src="numeric.js"></script>
<script src="stats.js"></script>
<script src="phase2-loader.js"></script>
<script>onGrade();</script>
</body>
</html>
