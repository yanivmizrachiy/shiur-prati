<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f172a">
<title>תרגילים — מחולל תרגילי מתמטיקה</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<link rel="stylesheet" href="style.css">
<style>
.engine-panel{background:#fff;border-radius:14px;padding:16px 20px;margin-bottom:18px;border-right:4px solid #2563eb;box-shadow:0 2px 14px rgba(0,0,0,.07)}
.engine-panel-inner{display:grid;grid-template-columns:1fr 1fr;gap:14px}.engine-badge{background:#2563eb;color:#fff;border-radius:20px;padding:2px 10px;font-size:.72rem;font-weight:800}.engine-card{border:1px solid #dbeafe}.engine-svg{max-width:min(300px,100%);height:auto;display:block;margin:auto}.mcq-choices{display:flex;flex-direction:column;gap:8px;margin-top:14px}.mcq-choice{background:#f8fafc;border:1.5px solid #dbeafe;border-radius:10px;padding:10px 14px}.mcq-label{font-weight:800;color:#2563eb;margin-left:6px}.mcq-correct{background:#f0fdf4;border-color:#86efac;color:#166534;font-weight:800}.tf-statement{background:#fff7ed;border-right:4px solid #f59e0b;border-radius:10px;padding:12px 16px}.tf-label{font-weight:800;color:#92400e;margin-left:8px}.tf-verdict{font-weight:800;color:#166534;margin-bottom:8px}.mistake-prompt{font-weight:800;color:#dc2626;margin-bottom:10px}.mistake-box{background:#fff1f2;border:1.5px solid #fca5a5;border-radius:10px;padding:12px 16px}@media(max-width:520px){.engine-panel-inner{grid-template-columns:1fr}}@media print{.engine-panel,.engine-badge{display:none!important}.engine-svg{max-width:260px}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
<header class="hdr"><div><h1>תרגילים</h1><div class="sub">מחולל תרגילי מתמטיקה — כיתות ז׳–ט׳</div></div><span class="badge" id="gradeBadge">כיתה ז׳</span></header>
<main>
<div class="card"><h2>הגדרות תרגיל</h2><div class="grid"><div><label for="sg">כיתה</label><select id="sg" onchange="onGrade()"><option value="7">כיתה ז׳</option><option value="8">כיתה ח׳</option><option value="9">כיתה ט׳</option></select></div><div><label for="sd">תחום</label><select id="sd" onchange="onDomain()"><option value="geometry">גאומטרי</option><option value="algebra">אלגברי</option><option value="numeric">מספרי</option><option value="uncertainty">אי-ודאות</option></select></div><div><label for="st">נושא</label><select id="st"></select></div><div><label for="sl">רמה</label><select id="sl"><option value="standard">סטנדרטית</option><option value="challenge">מאתגרת</option></select></div></div><button class="btn-gen" onclick="generate()">צור תרגיל ◀</button></div>
<div class="engine-panel" id="enginePanel" style="display:none"><div class="engine-panel-inner"><div><label for="selQType">סוג שאלה</label><select id="selQType"><option value="open">שאלה פתוחה</option><option value="mcq">רב־ברירה</option><option value="tf">נכון / שגוי</option><option value="mistake">מצא את הטעות</option></select></div><div><label for="selDiff">רמת מנוע</label><select id="selDiff"><option value="standard">סטנדרטית</option><option value="basic">בסיסית</option><option value="challenge">מאתגרת</option></select></div></div></div>
<div class="notice" id="g9notice"><strong>כיתה ט׳ — תוכנית לימודים קיימת, אך אין עדיין דוגמאות מקור.</strong><br>המחולל מייצר תרגילים רק מחומרי מקור שיניב העלה.</div>
<div id="out"><div class="empty">בחרו כיתה, תחום ונושא — ולחצו על ״צור תרגיל ◀״</div></div>
</main>
<script src="core.js"></script>
<script src="export.js"></script>
<script src="geo.js"></script>
<script src="algebra.js"></script>
<script src="numeric.js"></script>
<script src="stats.js"></script>
<script src="engine/schema.js"></script>
<script src="engine/random.js"></script>
<script src="engine/validators.js"></script>
<script src="engine/themes.js"></script>
<script src="engine/diagrams.js"></script>
<script src="engine/question-types.js"></script>
<script src="engine/pilot-g7-03.js"></script>
<script src="engine/pilot-n8-03.js"></script>
<script src="engine/pilot-n8-04.js"></script>
<script src="engine/pattern-engine.js"></script>
<script src="phase2-loader.js"></script>
<script>onGrade();</script>
</body>
</html>
