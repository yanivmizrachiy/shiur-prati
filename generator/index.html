<header class="hdr"><div><h1>תרגילים</h1><div class="sub">מחולל תרגילי מתמטיקה — כיתות ז׳–ח׳</div><div class="credit">האתר מנוהל ע"י יניב רז</div><a class="book-link" href="book.html">פתח ספר חומרי לימוד</a></div><span class="badge" id="gradeBadge">כיתה ז׳</span></header>
<main>
<div class="main-title" id="mainTitle" style="display:none"></div>
<div class="card"><h2>הגדרות תרגיל</h2><div class="grid"><div><label for="sg">כיתה</label><select id="sg" onchange="onGrade()"><option value="7">כיתה ז׳</option><option value="8">כיתה ח׳</option></select></div><div><label for="sd">תחום</label><select id="sd" onchange="onDomain()"><option value="geometry">גיאומטרי</option><option value="algebra">אלגברי</option><option value="numeric">מספרי</option><option value="uncertainty">אי-ודאות</option></select></div><div><label for="st">נושא</label><select id="st"></select></div><div><label for="sl">רמה</label><select id="sl"><option value="basic">רמה 1</option><option value="standard" selected>רמה 2</option><option value="challenge">רמה 3</option><option value="ladder">סולם רמות 1-3</option></select></div><div><label for="sv">תצוגת שרטוטים</label><select id="sv" onchange="onVisualMode()"><option value="color">צבע</option><option value="bw">שחור-לבן</option></select></div><div><label for="sn">מספר תרגילים</label><select id="sn"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5" selected>5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option></select></div></div><button class="btn-gen" onclick="generate()">צור דף תרגילים ◀</button></div>
<div class="engine-panel" id="enginePanel" style="display:none"><div class="engine-panel-inner"><div><label for="selQType">סוג שאלות</label><select id="selQType"><option value="mixed" selected>מעורב</option><option value="open">שאלה פתוחה</option><option value="mcq">רב־ברירה</option><option value="tf">נכון / שגוי</option><option value="mistake">מצא את הטעות</option></select></div><div><label for="selDiff">רמת קושי</label><select id="selDiff"><option value="basic">רמה 1</option><option value="standard" selected>רמה 2</option><option value="challenge">רמה 3</option><option value="ladder">סולם רמות 1-3</option></select></div><div><label for="selMcqMode">רב־ברירה: מספר תשובות נכונות</label><select id="selMcqMode"><option value="single" selected>תשובה אחת נכונה</option><option value="multi">ייתכן יותר מאחת</option></select></div></div></div>
<div id="out"><div class="empty"><span class="empty-icon">📐</span>בחרו כיתה, תחום, נושא ומספר תרגילים — ולחצו על ״צור דף תרגילים ◀״.<br>יופק דף ממוספר עם מפתח תשובות, מבוסס על חומרי תוכנית הלימודים לכיתות ז׳–ח׳.</div></div>
</main>
