<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{font-family:"Segoe UI",Arial,sans-serif;background:#f0f2f8;color:#1a1a2e;direction:rtl;min-height:100vh}.hdr{background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;padding:16px 24px;display:flex;align-items:center;gap:12px}.hdr h1{font-size:1.35rem;font-weight:800}.hdr .sub{font-size:.78rem;color:#8892b0;margin-top:2px}.badge{margin-right:auto;background:#e63946;color:#fff;border-radius:20px;padding:3px 14px;font-size:.78rem;font-weight:700}main{max-width:880px;margin:0 auto;padding:24px 16px 80px}.card{background:#fff;border-radius:14px;padding:22px 24px;box-shadow:0 2px 14px rgba(0,0,0,.08);margin-bottom:20px}.card h2{font-size:.95rem;font-weight:700;color:#16213e;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-bottom:18px}label{display:block;font-size:.78rem;font-weight:600;color:#555;margin-bottom:5px}select{width:100%;border:1.5px solid #dde2ef;border-radius:8px;padding:8px 10px;font-size:.88rem;font-family:inherit;direction:rtl;background:#fafbff;color:#1a1a2e}select:focus{outline:none;border-color:#4361ee}.btn-gen{background:linear-gradient(135deg,#4361ee,#3a0ca3);color:#fff;border:none;border-radius:10px;padding:11px 32px;font-size:1rem;font-weight:700;cursor:pointer}.btn-gen:hover{opacity:.9}.qcard{background:#fff;border-radius:14px;padding:26px 26px 20px;box-shadow:0 2px 16px rgba(0,0,0,.09);margin-bottom:18px}.qmeta{font-size:.73rem;color:#8892b0;margin-bottom:10px;display:flex;gap:8px;flex-wrap:wrap}.tag{background:#edf2ff;color:#4361ee;border-radius:20px;padding:2px 10px;font-weight:600}.tag.geo{background:#fef3c7;color:#92400e}.tag.num{background:#dcfce7;color:#166534}.tag.alg{background:#ede9fe;color:#5b21b6}.tag.unc{background:#e0f2fe;color:#075985}.qtext{font-size:1.05rem;line-height:1.85;color:#1a1a2e;margin-bottom:16px;white-space:pre-line}.diagram{display:flex;justify-content:center;margin:12px 0 18px}.diagram svg{max-width:270px;height:auto}.btn-ans{background:none;border:1.5px solid #dde2ef;border-radius:8px;padding:7px 16px;font-size:.86rem;cursor:pointer;color:#4361ee;font-weight:600;margin-bottom:10px;font-family:inherit}.btn-ans:hover{background:#edf2ff}.answer{background:#f0fdf4;border-radius:8px;padding:14px 16px;font-size:.93rem;color:#166534;line-height:1.75;display:none;white-space:pre-line}.answer.open{display:block}.expbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid #eee}.btn-exp{background:#f0f4ff;color:#4361ee;border:1.5px solid #c7d2fe;border-radius:8px;padding:7px 14px;font-size:.8rem;font-weight:600;cursor:pointer}.btn-exp:hover{background:#e0e7ff}.btn-exp:disabled{opacity:.45;cursor:default}.expstat{font-size:.76rem;color:#666;align-self:center}.notice{background:#fff7ed;border:1.5px solid #fed7aa;border-radius:10px;padding:14px 18px;font-size:.86rem;color:#9a3412;line-height:1.65;display:none;margin-bottom:18px}.notice.open{display:block}.wip{background:#faf5ff;border:1.5px solid #ddd6fe;border-radius:10px;padding:14px 18px;font-size:.88rem;color:#5b21b6;line-height:1.65}.empty{text-align:center;color:#8892b0;padding:44px 0;font-size:.95rem}@media print{.card,.hdr,.expbar,.btn-ans,.btn-gen{display:none!important}.qcard{box-shadow:none;border:1px solid #ccc;break-inside:avoid}.answer{display:block!important}main{padding:0;max-width:100%}}

<body>
<header class="hdr"><div><h1>תרגילים</h1><div class="sub">מחולל תרגילי מתמטיקה — כיתות ז׳–ט׳</div></div><span class="badge" id="gradeBadge">כיתה ז׳</span></header>
<main>
<div class="card"><h2>הגדרות תרגיל</h2><div class="grid"><div><label for="sg">כיתה</label><select id="sg" onchange="onGrade()"><option value="7">כיתה ז׳</option><option value="8">כיתה ח׳</option><option value="9">כיתה ט׳</option></select></div><div><label for="sd">תחום</label><select id="sd" onchange="onDomain()"><option value="geometry">גאומטרי</option><option value="algebra">אלגברי</option><option value="numeric">מספרי</option><option value="uncertainty">אי-ודאות</option></select></div><div><label for="st">נושא</label><select id="st"></select></div><div><label for="sl">רמה</label><select id="sl"><option value="standard">סטנדרטית</option><option value="challenge">מאתגרת</option></select></div></div><button class="btn-gen" onclick="generate()">צור תרגיל ◀</button></div>
<div class="notice" id="g9notice"><strong>כיתה ט׳ — תוכנית לימודים קיימת, אך אין עדיין דוגמאות מקור.</strong><br>המחולל מייצר תרגילים רק מחומרי מקור שיניב העלה.</div>
<div id="out"><div class="empty">בחרו כיתה, תחום ונושא — ולחצו על ״צור תרגיל ◀״</div></div>
</main>
<script>
const TOPICS={
7:{geometry:[{id:'G7-03',label:'משפט פיתגורס — מציאת צלע',has:true},{id:'G7-02',label:'שטחי צורות — משולש, מקביל, טרפז',has:false},{id:'G7-01',label:'מלבן ותיבה — היקף, שטח, נפח',has:false},{id:'G7-04',label:'זוויות — חישוב זווית חסרה',has:true}],algebra:[{id:'A7-01',label:'ביטויים אלגבריים — כתיבה והצבה',has:false},{id:'A7-03',label:'משוואות מד ראשונה',has:true},{id:'A7-06',label:'פונקציה ישרונית f(x)=ax+b',has:false},{id:'A7-SEQ',label:'סדרות — ביטוי אלגברי',has:false}],numeric:[{id:'N7-06',label:'חזקות: (−a)ⁿ לעומת −aⁿ',has:true},{id:'N7-07',label:'שורש ריבועי',has:false},{id:'N7-04',label:'חיבור/חיסור מספרים מכוונים',has:false}],uncertainty:[{id:'U7-01',label:'טבלת תדירות',has:false},{id:'U7-02',label:'הסתברות תיאורטית בסיסית',has:false}]},
8:{geometry:[{id:'G8-01',label:'עיגול — היקף ושטח',has:false},{id:'G8-04',label:'ניידות משולשים',has:false},{id:'G8-03',label:'חפיפת משולשים',has:false}],algebra:[{id:'A8-02',label:'שיפוע ומשוואת ישר',has:false},{id:'A8-03',label:'מערכות משוואות',has:false}],numeric:[{id:'N8-04',label:'אחוזים — מצבים סטטיים',has:true},{id:'N8-05',label:'אחוזים — מצבים דינמיים',has:false},{id:'N8-02',label:'פרופורציה',has:false}],uncertainty:[{id:'U8-01',label:'ממוצע, חציון, טווח',has:true},{id:'U8-02',label:'הסתברות בסיסית',has:false}]},
9:{algebra:[{id:'A9-02',label:'פונקציות ריבועיות',has:false},{id:'A9-03',label:'משוואות ריבועיות',has:false},{id:'A9-01',label:'חוקי חזקות',has:false}],geometry:[{id:'G9-01',label:'הוכחות גאומטריות',has:false},{id:'G9-02',label:'מעגל מתקדם',has:false}],numeric:[],uncertainty:[{id:'A9-04',label:'הסתברות מורכבת',has:false}]}
};
const TRIPLES=[[3,4,5],[5,12,13],[6,8,10],[8,15,17],[9,12,15],[10,24,26],[7,24,25],[20,21,29]],ANGLE_PAIRS=[[40,70],[30,90],[55,65],[45,80],[35,75],[60,60],[50,70],[25,110],[40,50],[65,55]],GLABEL={7:'כיתה ז׳',8:'כיתה ח׳',9:'כיתה ט׳'};
function grade(){return +document.getElementById('sg').value}function domain(){return document.getElementById('sd').value}function onGrade(){const g=grade();document.getElementById('gradeBadge').textContent=GLABEL[g];document.getElementById('g9notice').className='notice'+(g===9?' open':'');onDomain()}function onDomain(){const g=grade(),d=domain(),sel=document.getElementById('st');sel.innerHTML='';((TOPICS[g]||{})[d]||[]).forEach(t=>{const o=document.createElement('option');o.value=t.id;o.textContent=t.label+(t.has?'':' ◦');sel.appendChild(o)})}function currentTopic(){const g=grade(),d=domain(),id=document.getElementById('st').value;return((TOPICS[g]||{})[d]||[]).find(t=>t.id===id)}
function generate(){const g=grade(),t=currentTopic();if(!t)return;if(g===9||!t.has){showWIP(t);return}if(t.id==='G7-03')genPythagoras();if(t.id==='G7-04')genMissingAngle();if(t.id==='N7-06')genPowers();if(t.id==='A7-03')genEquation();if(t.id==='U8-01')genStats();if(t.id==='N8-04')genPercentStatic()}function showWIP(t){document.getElementById('out').innerHTML=`<div class="qcard"><div class="qmeta"><span class="tag">בפיתוח</span><span>${t.id}</span></div><div class="wip">נושא זה עדיין בפיתוח. פעילים עכשיו: G7-03, G7-04, N7-06, A7-03, U8-01, N8-04.</div></div>`}
function genPythagoras(){const diff=document.getElementById('sl').value,[a,b,c]=TRIPLES[Math.floor(Math.random()*TRIPLES.length)],unk=diff==='challenge'?(Math.random()<.5?'a':'b'):['a','b','c'][Math.floor(Math.random()*3)];let qtext,atext,svg;if(unk==='c'){qtext=`במשולש ישר-זווית, שתי הרגליים הן $${a}$ ס"מ ו-$${b}$ ס"מ.\nחשבו את אורך היתר.`;atext=`לפי פיתגורס: $${a}^2+${b}^2=c^2$\n$$${a*a}+${b*b}=c^2$$\n$$c=\\sqrt{${c*c}}=${c}$$\nאורך היתר: $${c}$ ס"מ.`;svg=triSVG(a,b,null)}else if(unk==='a'){qtext=`במשולש ישר-זווית, יתר $${c}$ ס"מ, רגל $${b}$ ס"מ.\nחשבו את אורך הרגל השנייה.`;atext=`$a^2+${b}^2=${c}^2$\n$$a^2=${c*c}-${b*b}=${a*a}$$\n$$a=\\sqrt{${a*a}}=${a}$$\nאורך הרגל: $${a}$ ס"מ.`;svg=triSVG(null,b,c)}else{qtext=`במשולש ישר-זווית, יתר $${c}$ ס"מ, רגל $${a}$ ס"מ.\nחשבו את אורך הרגל השנייה.`;atext=`$${a}^2+b^2=${c}^2$\n$$b^2=${c*c}-${a*a}=${b*b}$$\n$$b=\\sqrt{${b*b}}=${b}$$\nאורך הרגל: $${b}$ ס"מ.`;svg=triSVG(a,null,c)}renderCard('G7-03','משפט פיתגורס',svg,qtext,atext,'geo')}
function genMissingAngle(){const [alpha,beta]=ANGLE_PAIRS[Math.floor(Math.random()*ANGLE_PAIRS.length)],gamma=180-alpha-beta,unknown=['A','B','C'][Math.floor(Math.random()*3)];const vals={A:alpha,B:beta,C:gamma};const given=Object.keys(vals).filter(k=>k!==unknown);const qtext=`במשולש ABC נתונות שתי זוויות:\n∠${given[0]} = ${vals[given[0]]}°\n∠${given[1]} = ${vals[given[1]]}°\nחשבו את ∠${unknown}.`;const atext=`סכום זוויות במשולש הוא 180°.\n∠${unknown}=180°−${vals[given[0]]}°−${vals[given[1]]}°=${vals[unknown]}°`;renderCard('G7-04','זווית חסרה במשולש',angleSVG(vals.A,vals.B,vals.C,unknown),qtext,atext,'geo')}
function genPowers(){const a=[2,3,4,5,6,7,8,9][Math.floor(Math.random()*8)],n=Math.random()<.7?2:3,res1=Math.pow(-a,n),res2=-Math.pow(a,n),product=Array(n).fill(`(-${a})`).join('·');const qtext=`חשבו את שני הביטויים והסבירו את ההבדל ביניהם:\nא. $(-${a})^{${n}}$\nב. $-${a}^{${n}}$`;const atext=`א. $(-${a})^{${n}}$: המספר $-${a}$ הוא הבסיס, כי הוא נמצא בתוך סוגריים.\n$$(-${a})^{${n}}=${product}=${res1}$$\nב. $-${a}^{${n}}$: קודם מחשבים את החזקה $${a}^{${n}}$, ורק אחר כך מוסיפים מינוס.\n$$-${a}^{${n}}=-(${a}^{${n}})=-${Math.pow(a,n)}=${res2}$$\nהבדל מרכזי: בסוגריים — המינוס חלק מהבסיס. בלי סוגריים — המינוס נוסף אחרי החזקה.`;renderCard('N7-06','חזקות — הבחנה בין סוגריים וללא סוגריים','',qtext,atext,'num')}
function genEquation(){const problems=[{kind:'mul',ctx:'מחיר כרטיס אחד הוא $x$ שקלים. קניתי {a} כרטיסים ושילמתי {total} שקלים. מה מחיר כרטיס אחד?',a:5,x:6,total:30,check:'בדיקה: $5\\cdot6=30$ ✓'},{kind:'mul',ctx:'מחיר כרטיס אחד הוא $x$ שקלים. קניתי {a} כרטיסים ושילמתי {total} שקלים. מה מחיר כרטיס אחד?',a:8,x:7,total:56,check:'בדיקה: $8\\cdot7=56$ ✓'},{kind:'sum',ctx:'בכיתה {total} תלמידים. מספר הבנות גדול ב-{a} ממספר הבנים. סמנו ב-$x$ את מספר הבנים. כמה בנים יש בכיתה?',a:4,x:11,total:26,check:'בדיקה: $11+(11+4)=26$ ✓'},{kind:'mul',ctx:'לילי חשבה על מספר. היא הכפילה אותו ב-{a} וקיבלה {total}. מה המספר שהיא חשבה עליו?',a:6,x:8,total:48,check:'בדיקה: $6\\cdot8=48$ ✓'},{kind:'sum',ctx:'מספר התפוזים בסל אחד הוא $x$. בסל שני יש {a} תפוזים יותר. בשני הסלים יש {total} תפוזים. כמה תפוזים בסל אחד?',a:5,x:9,total:23,check:'בדיקה: $9+(9+5)=23$ ✓'}];const p=problems[Math.floor(Math.random()*problems.length)],qtext=p.ctx.replaceAll('{a}',p.a).replaceAll('{total}',p.total);let eq,steps;if(p.kind==='mul'){eq=`$${p.a}x=${p.total}$`;steps=`$$${p.a}x=${p.total}$$\n$$x=\\frac{${p.total}}{${p.a}}=${p.x}$$`}else{eq=`$x+(x+${p.a})=${p.total}$`;steps=`$$x+x+${p.a}=${p.total}$$\n$$2x=${p.total-p.a}$$\n$$x=\\frac{${p.total-p.a}}{2}=${p.x}$$`}const atext=`מסמנים ב-$x$ את הנעלם.\nמשוואה: ${eq}\nפתרון:\n${steps}\n${p.check}`;renderCard('A7-03','משוואה מדרגה ראשונה','',qtext,atext,'alg')}
function genStats(){const datasets=[[72,85,90,68,85,77,92,85,73,80],[55,60,72,60,88,91,60,74,83,67],[45,50,62,78,50,84,91,50,73,67],[30,45,45,52,67,45,71,88,92,65],[12,18,24,18,31,18,42,37,29,51]],raw=datasets[Math.floor(Math.random()*datasets.length)],sorted=[...raw].sort((a,b)=>a-b),n=raw.length,sum=raw.reduce((a,b)=>a+b,0),mean=Math.round(sum/n*10)/10,mid1=sorted[n/2-1],mid2=sorted[n/2],median=(mid1+mid2)/2,range=sorted[n-1]-sorted[0];const qtext=`לפניכם ציוני ${n} תלמידים במבחן:\n$${raw.join(', ')}$\nא. חשבו את הממוצע.\nב. מצאו את החציון.\nג. חשבו את הטווח.`;const atext=`א. ממוצע:\n$$\\frac{${raw.join('+')}}{${n}}=\\frac{${sum}}{${n}}=${mean}$$\nב. חציון — קודם ממיינים: $${sorted.join(', ')}$\nיש ${n} ערכים, לכן החציון הוא ממוצע שני הערכים האמצעיים:\n$$\\frac{${mid1}+${mid2}}{2}=${median}$$\nג. טווח:\n$$${sorted[n-1]}-${sorted[0]}=${range}$$`;renderCard('U8-01','ממוצע, חציון וטווח','',qtext,atext,'unc')}
function genPercentStatic(){const types=['pct_of_n','find_whole','find_pct'],type=types[Math.floor(Math.random()*types.length)],contexts=[{item:'תלמידים'},{item:'שקלים'},{item:'ילדים'},{item:'מוצרים'}],ctx=contexts[Math.floor(Math.random()*contexts.length)],pairs=[{p:25,n:80,k:20},{p:50,n:60,k:30},{p:10,n:90,k:9},{p:20,n:150,k:30},{p:75,n:40,k:30},{p:30,n:200,k:60},{p:5,n:120,k:6},{p:40,n:250,k:100},{p:15,n:60,k:9},{p:60,n:50,k:30}],{p,n,k}=pairs[Math.floor(Math.random()*pairs.length)];let qtext,atext;if(type==='pct_of_n'){qtext=`בכיתה יש $${n}$ ${ctx.item}.\n$${p}\\%$ מהם ניגשים לעזרה נוספת.\nכמה ${ctx.item} ניגשים לעזרה?`;atext=`$$${p}\\% \text{ מתוך } ${n}=\\frac{${p}}{100}\\times ${n}=${k}$$\n${k} ${ctx.item} ניגשים לעזרה.`}else if(type==='find_whole'){qtext=`$${k}$ ${ctx.item} מהווים $${p}\\%$ מכלל ה${ctx.item}.\nכמה ${ctx.item} יש בסך הכל?`;atext=`אם $${p}\\%$ שווים $${k}$, אז $100\\%$ שווים:\n$$\\frac{${k}}{${p}}\\times100=${n}$$\nבסך הכל יש $${n}$ ${ctx.item}.`}else{qtext=`בכיתה יש $${n}$ ${ctx.item}. $${k}$ מהם ניגשים לעזרה.\nכמה אחוזים מה${ctx.item} ניגשים לעזרה?`;atext=`$$\\frac{${k}}{${n}}\\times100=${p}\\%$$\n$${p}\\%$ מה${ctx.item} ניגשים לעזרה.`}renderCard('N8-04','אחוזים סטטיים','',qtext,atext,'num')}
function renderCard(id,title,svg,qtext,atext,tagClass='geo'){const cid='qc'+Date.now(),aid='qa'+Date.now(),diagram=svg?`<div class="diagram">${svg}</div>`:'',domainLabel=tagClass==='num'?'מספרי':tagClass==='alg'?'אלגברי':tagClass==='unc'?'אי-ודאות':'גאומטריה',gradeLabel=(id==='U8-01'||id==='N8-04')?'כיתה ח׳':'כיתה ז׳';document.getElementById('out').innerHTML=`<div class="qcard" id="${cid}"><div class="qmeta"><span class="tag ${tagClass}">${gradeLabel}</span><span class="tag ${tagClass}">${domainLabel}</span><span class="tag">${id}</span><span>${title}</span></div>${diagram}<div class="qtext">${qtext}</div><button class="btn-ans" onclick="toggleAns('${aid}',this)">הצג פתרון ▾</button><div class="answer" id="${aid}">${atext}</div><div class="expbar"><button class="btn-exp" onclick="copyImg('${cid}',this)">📋 העתק כתמונה</button><button class="btn-exp" onclick="dlPNG('${cid}',this)">⬇ PNG</button><button class="btn-exp" onclick="window.print()">🖨 הדפס</button><span class="expstat" id="st-${cid}"></span></div></div>`;renderMathInElement(document.getElementById(cid),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false})}
function angleSVG(a,b,c,unknown){const W=240,H=170,p=28,Ax=p,Ay=H-p,Bx=W-p,By=H-p,Cx=Math.round(W*.38),Cy=p+10,lA=unknown==='A'?'?':a+'°',lB=unknown==='B'?'?':b+'°',lC=unknown==='C'?'?':c+'°';return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"><polygon points="${Ax},${Ay} ${Bx},${By} ${Cx},${Cy}" fill="#fef3c7" stroke="#92400e" stroke-width="2" stroke-linejoin="round"/><path d="M${Ax+26},${Ay} Q${Ax+13},${Ay-15} ${Ax+35},${Ay-28}" fill="none" stroke="#92400e" stroke-width="1.5"/><path d="M${Bx-26},${By} Q${Bx-16},${By-18} ${Bx-40},${By-30}" fill="none" stroke="#92400e" stroke-width="1.5"/><path d="M${Cx-18},${Cy+28} Q${Cx},${Cy+42} ${Cx+24},${Cy+25}" fill="none" stroke="#92400e" stroke-width="1.5"/><text x="${Ax-18}" y="${Ay+4}" font-size="13" fill="#1a1a2e" font-family="Segoe UI,Arial" text-anchor="middle">A</text><text x="${Bx+12}" y="${By+4}" font-size="13" fill="#1a1a2e" font-family="Segoe UI,Arial" text-anchor="middle">B</text><text x="${Cx}" y="${Cy-10}" font-size="13" fill="#1a1a2e" font-family="Segoe UI,Arial" text-anchor="middle">C</text><text x="${Ax+23}" y="${Ay-10}" font-size="12" fill="${unknown==='A'?'#e63946':'#166534'}" font-family="Segoe UI,Arial" text-anchor="middle">${lA}</text><text x="${Bx-24}" y="${By-10}" font-size="12" fill="${unknown==='B'?'#e63946':'#166534'}" font-family="Segoe UI,Arial" text-anchor="middle">${lB}</text><text x="${Cx+20}" y="${Cy+22}" font-size="12" fill="${unknown==='C'?'#e63946':'#166534'}" font-family="Segoe UI,Arial" text-anchor="middle">${lC}</text></svg>`}
function triSVG(la,lb,lc){const W=230,H=165,p=32,bx=p,by=H-p,cx=W-p,cy=H-p,ax=p,ay=p+8,sq=10,lA=la!=null?`${la} ס"מ`:'?',lB=lb!=null?`${lb} ס"מ`:'?',lC=lc!=null?`${lc} ס"מ`:'?';return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"><polygon points="${ax},${ay} ${bx},${by} ${cx},${cy}" fill="#edf2ff" stroke="#4361ee" stroke-width="2" stroke-linejoin="round"/><polyline points="${bx+sq},${by} ${bx+sq},${by-sq} ${bx},${by-sq}" fill="none" stroke="#4361ee" stroke-width="1.5"/><text x="${bx-20}" y="${(ay+by)/2+5}" font-size="12" fill="#1a1a2e" font-family="Segoe UI,Arial" text-anchor="middle">${lA}</text><text x="${(bx+cx)/2}" y="${by+18}" font-size="12" fill="#1a1a2e" font-family="Segoe UI,Arial" text-anchor="middle">${lB}</text><text x="${(ax+cx)/2+16}" y="${(ay+cy)/2-6}" font-size="12" fill="#e63946" font-family="Segoe UI,Arial" text-anchor="middle" transform="rotate(-36,${(ax+cx)/2+16},${(ay+cy)/2-6})">${lC}</text><text x="${ax-8}" y="${ay-4}" font-size="10" fill="#8892b0" font-family="Segoe UI,Arial">A</text><text x="${bx-14}" y="${by+5}" font-size="10" fill="#8892b0" font-family="Segoe UI,Arial">B</text><text x="${cx+4}" y="${cy+5}" font-size="10" fill="#8892b0" font-family="Segoe UI,Arial">C</text></svg>`}
function toggleAns(id,btn){const el=document.getElementById(id),open=el.classList.toggle('open');btn.textContent=open?'הסתר פתרון ▴':'הצג פתרון ▾'}async function copyImg(cid,btn){const el=document.getElementById(cid),st=document.getElementById('st-'+cid);btn.disabled=true;st.textContent='מכין...';try{const cv=await html2canvas(el,{scale:2,backgroundColor:'#fff',logging:false});try{const blob=await new Promise(r=>cv.toBlob(r,'image/png'));await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);st.textContent='✓ הועתק'}catch{dlCanvas(cv,'targilim.png');st.textContent='⬇ הורד'}}catch{st.textContent='שגיאה'}btn.disabled=false}async function dlPNG(cid,btn){const el=document.getElementById(cid),st=document.getElementById('st-'+cid);btn.disabled=true;st.textContent='מכין...';try{const cv=await html2canvas(el,{scale:2,backgroundColor:'#fff',logging:false});dlCanvas(cv,'targilim.png');st.textContent='✓ הורד'}catch{st.textContent='שגיאה'}btn.disabled=false}function dlCanvas(cv,name){const a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download=name;a.click()}const Analytics={questionGenerated:()=>{},exportUsed:()=>{}};onDomain();
