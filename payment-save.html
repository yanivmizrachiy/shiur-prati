<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ff7a00">
  <title>שמירת תשלום — שיעור פרטי</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header><div><div class="tag">שמירת תשלום פרטית</div><h1>שיעור פרטי</h1></div></header>
  <main>
    <section class="screen active">
      <div class="hero"><h2>שמירת תשלום</h2><p id="status">מנסה לשמור תשלום בדפדפן הזה בלבד...</p></div>
      <div id="result" class="card"></div>
      <button id="openApp" class="primary full">פתח את האפליקציה</button>
    </section>
  </main>
</div>
<script>
(() => {
  const KEY = 'shiur_prati_v1';
  const $ = s => document.querySelector(s);
  const uid = p => `${p}_${Date.now()}_${Math.random().toString(16).slice(2)}`;
  const now = () => new Date().toISOString();
  const money = n => `${Number(n || 0).toLocaleString('he-IL')} ₪`;
  const load = () => {
    try { const d = JSON.parse(localStorage.getItem(KEY) || '{}'); return { students: Array.isArray(d.students) ? d.students : [], lessons: Array.isArray(d.lessons) ? d.lessons : [], logs: Array.isArray(d.logs) ? d.logs : [], payments: Array.isArray(d.payments) ? d.payments : [] }; }
    catch { return { students: [], lessons: [], logs: [], payments: [] }; }
  };
  const save = db => localStorage.setItem(KEY, JSON.stringify(db));
  function params(){ return new URLSearchParams((location.hash || '').replace(/^#/, '')); }
  function run(){
    const p = params();
    const token = p.get('t') || `pay-${Date.now()}`;
    const name = (p.get('student') || '').trim();
    const amount = Number(String(p.get('amount') || '').replace(/[^0-9.]/g, '')) || 0;
    const method = (p.get('method') || '').trim();
    const date = p.get('date') || new Date().toISOString().slice(0,10);
    if (!name || amount <= 0) { $('#status').textContent = 'חסרים שם או סכום. לא נשמר דבר.'; return; }

    const db = load();
    if (db.logs.some(x => x.action === 'payment_save' && x.token === token)) {
      $('#status').textContent = 'התשלום הזה כבר נשמר בעבר. לא נוצרה כפילות.';
      $('#result').innerHTML = '<p>אפשר לפתוח את האפליקציה ולבדוק.</p>';
      return;
    }

    let st = db.students.find(x => (x.fullName || '').trim() === name);
    if (!st) {
      st = { studentId: uid('student'), fullName: name, phone: '', grade: '', defaultLessonPrice: 0, status: 'פעיל', notes: '', createdAt: now(), updatedAt: now() };
      db.students.push(st);
    }

    let remaining = amount;
    let applied = 0;
    const openLessons = db.lessons
      .filter(l => l.studentId === st.studentId && l.lessonStatus === 'התקיים' && Math.max(Number(l.amountDue || 0) - Number(l.amountPaid || 0), 0) > 0)
      .sort((a,b) => String(a.lessonDate || '').localeCompare(String(b.lessonDate || '')) || String(a.lessonTime || '').localeCompare(String(b.lessonTime || '')));

    for (const l of openLessons) {
      if (remaining <= 0) break;
      const due = Number(l.amountDue || 0);
      const paid = Number(l.amountPaid || 0);
      const debt = Math.max(due - paid, 0);
      const add = Math.min(debt, remaining);
      l.amountPaid = paid + add;
      l.amountUnpaid = Math.max(due - l.amountPaid, 0);
      l.updatedAt = now();
      if (l.amountUnpaid === 0) l.lessonStatus = 'התקיים';
      applied += add;
      remaining -= add;
    }

    const payment = { paymentId: uid('payment'), studentId: st.studentId, studentName: name, paymentDate: date, amount, method, appliedAmount: applied, unappliedAmount: remaining, createdAt: now() };
    db.payments.push(payment);
    db.logs.push({ id: uid('log'), time: now(), action: 'payment_save', token, student: name, amount, method, applied, remaining });
    save(db);

    $('#status').textContent = 'התשלום נשמר בדפדפן הזה בלבד.';
    $('#result').innerHTML = `<h3>נשמר תשלום</h3><p>${name}: ${money(amount)} ${method ? '· ' + method : ''}</p><p>נסגר מול חובות: ${money(applied)}</p><p>יתרה שלא שויכה לשיעור פתוח: ${money(remaining)}</p>`;
    alert(`נשמר תשלום: ${name}, ${amount} ₪. נסגר מול חובות: ${applied} ₪.`);
  }
  $('#openApp').addEventListener('click', () => location.href = './');
  run();
})();
</script>
</body>
</html>
