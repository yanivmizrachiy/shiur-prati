name: Verify live generator report artifact

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "generator/index.html"
      - "generator/geo.js"
      - "generator/core.js"
      - "generator/engine/**"
      - ".github/workflows/verify-generator-live-report.yml"

permissions:
  contents: read

concurrency:
  group: verify-generator-live-report
  cancel-in-progress: true

jobs:
  verify-live-generator-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm install -D playwright
          npx playwright install chromium --with-deps

      - name: Run live browser verification
        id: verify
        env:
          GENERATOR_URL: "https://yanivmizrachiy.github.io/targilim/"
        shell: bash
        run: |
          set +e
          mkdir -p live-verification-artifacts
          cat > verify-generator-live.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const url = process.env.GENERATOR_URL;
          const browser = await chromium.launch();
          const page = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 2, isMobile: true });
          const errors = [];
          page.on('pageerror', err => errors.push(err.message));
          page.on('console', msg => {
            const text = msg.text();
            if (msg.type() === 'error' && /TypeError|ReferenceError|SyntaxError/.test(text)) errors.push(text);
          });

          const result = {
            url,
            status: 'UNKNOWN',
            checks: [],
            error: null,
            questionText: null,
            answerText: null,
            exportButtonCount: 0,
            engineChecks: [],
            timestamp: new Date().toISOString()
          };

          function ok(name){ result.checks.push({ name, ok: true }); }
          function assertMathAnswer(label, text){
            if (!text || text.trim().length < 2 || !/[abcABCd]|\d|%|פיתגורס|חזקה|שוויון|טעות|אחוז/.test(text)) {
              throw new Error(label + ' answer text is empty or not mathematical: ' + text);
            }
          }
          async function selectTopic(id){
            await page.waitForFunction((topicId) => [...document.querySelectorAll('#st option')].some(o => o.value === topicId), id, { timeout: 15000 });
            await page.selectOption('#st', id);
          }
          async function latestCard(){
            await page.waitForSelector('.qcard', { timeout: 10000 });
            return page.locator('.qcard').last();
          }
          async function generateAssert(label, requireSvg = true){
            await page.click('.btn-gen');
            const card = await latestCard();
            if (requireSvg) await card.locator('svg').first().waitFor({ timeout: 10000 });
            await card.locator('.qtext').first().waitFor({ timeout: 10000 });
            const q = await card.locator('.qtext').first().innerText();
            if (!q || q.trim().length < 3 || !/משולש|יתר|רגל|מלבן|אלכסון|שגוי|טעות|אחוז|מתוך|כמה|מהווים/.test(q)) throw new Error(label + ' bad question text: ' + q);
            const count = await card.locator('.btn-exp').count();
            if (count < 3) throw new Error(label + ' expected at least 3 export buttons, found ' + count);
            await card.locator('.btn-ans').first().click();
            await card.locator('.answer.open').first().waitFor({ timeout: 10000 });
            const a = await card.locator('.answer.open').first().innerText();
            assertMathAnswer(label, a);
            const hasHorizontalScroll = await page.evaluate(() => document.body.scrollWidth > window.innerWidth + 2);
            if (hasHorizontalScroll) throw new Error(label + ' horizontal scroll detected on mobile viewport');
            return { questionText: q, answerText: a, exportButtonCount: count };
          }
          async function verifyEngineTopic({grade,domain,id,qtypes,needSvg}){
            await page.selectOption('#sg', grade);
            await page.selectOption('#sd', domain);
            await page.waitForFunction((topicId) => TOPICS?.[Number(document.querySelector('#sg').value)]?.[document.querySelector('#sd').value]?.some(t => t[0] === topicId), id, { timeout: 30000 });
            await selectTopic(id);
            for (const qtype of qtypes) {
              await page.selectOption('#selQType', qtype);
              await page.selectOption('#selDiff', qtype === 'open' ? 'basic' : 'standard');
              const engineResult = await generateAssert('engine ' + id + ' ' + qtype, needSvg);
              result.engineChecks.push({ id, qtype, ok: true, questionText: engineResult.questionText, exportButtonCount: engineResult.exportButtonCount });
            }
            ok('engine ' + id + ' verified: ' + qtypes.join(', '));
          }

          try {
            await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 });
            ok('page loaded');
            await page.waitForSelector('text=תרגילים', { timeout: 30000 });
            ok('Hebrew title visible');
            await page.waitForSelector('#sg', { timeout: 10000 });
            await page.waitForSelector('#sd', { timeout: 10000 });
            await page.waitForSelector('#st', { timeout: 10000 });
            ok('selectors visible');

            await page.selectOption('#sg', '7');
            await page.selectOption('#sd', 'geometry');
            await selectTopic('G7-03');
            await page.selectOption('#sl', 'standard');
            ok('selected grade 7 geometry G7-03');
            const legacy = await generateAssert('legacy G7-03', true);
            result.questionText = legacy.questionText;
            result.answerText = legacy.answerText;
            result.exportButtonCount = legacy.exportButtonCount;
            ok('legacy G7-03 verified');

            await verifyEngineTopic({grade:'7', domain:'geometry', id:'G7-03-ENGINE', qtypes:['open','mcq','tf','mistake'], needSvg:true});
            await verifyEngineTopic({grade:'8', domain:'numeric', id:'N8-04-ENGINE', qtypes:['open','mcq','tf','mistake'], needSvg:false});

            await page.screenshot({ path: 'live-verification-artifacts/generator-live-smoke.png', fullPage: true });
            ok('screenshot saved');
            if (errors.length > 0) throw new Error('Browser console/page errors: ' + errors.join(' | '));
            ok('no browser console errors');
            result.status = 'PASS';
          } catch (err) {
            result.status = 'FAIL';
            result.error = String(err?.stack || err?.message || err);
            try { await page.screenshot({ path: 'live-verification-artifacts/generator-live-smoke.png', fullPage: true }); } catch {}
          } finally {
            await browser.close();
          }

          const lines = [];
          lines.push('# Generator Live Verification Report');
          lines.push('');
          lines.push('Date: ' + result.timestamp);
          lines.push('URL: ' + result.url);
          lines.push('Status: ' + result.status);
          lines.push('');
          lines.push('## Checks');
          for (const check of result.checks) lines.push('- ' + (check.ok ? 'PASS' : 'FAIL') + ' — ' + check.name);
          lines.push('');
          lines.push('## Engine checks');
          if (result.engineChecks.length) {
            for (const check of result.engineChecks) lines.push('- PASS — ' + check.id + ' / ' + check.qtype + ' / exportButtonCount=' + check.exportButtonCount);
          } else {
            lines.push('- Not reached');
          }
          lines.push('');
          lines.push('## Observed');
          lines.push('- exportButtonCount: ' + result.exportButtonCount);
          if (result.questionText) lines.push('- questionText: ' + result.questionText.replace(/\n/g, ' / '));
          if (result.answerText) lines.push('- answerText: ' + result.answerText.replace(/\n/g, ' / '));
          if (result.error) { lines.push(''); lines.push('## Error'); lines.push('```'); lines.push(result.error); lines.push('```'); }
          fs.writeFileSync('live-verification-artifacts/generator-live-latest.md', lines.join('\n'), 'utf8');
          fs.writeFileSync('live-verification-artifacts/generator-live-latest.json', JSON.stringify(result, null, 2), 'utf8');
          process.exit(result.status === 'PASS' ? 0 : 1);
          EOF

          node verify-generator-live.mjs
          status=$?
          echo "verify_status=$status" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Upload live verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generator-live-verification
          path: live-verification-artifacts/
          if-no-files-found: warn
