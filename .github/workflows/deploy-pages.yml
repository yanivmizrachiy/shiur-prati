name: Deploy targilim to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify generator exists
        run: test -f generator/index.html || (echo "generator/index.html missing" && exit 1)
      - name: Bundle learning-material PDFs into the published site
        run: |
          mkdir -p generator/assets/sources
          for f in sources/intake/2026-06-09/*/*.pdf; do
            case "$f" in */originals/*) continue;; esac
            cp "$f" generator/assets/sources/
          done
          echo "Bundled $(ls -1 generator/assets/sources/*.pdf | wc -l) learning-material PDFs."
          test "$(ls -1 generator/assets/sources/*.pdf | wc -l)" -eq 10 || (echo "expected 10 learning-material PDFs" && exit 1)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "generator"
      - id: deployment
        uses: actions/deploy-pages@v4
