          <!DOCTYPE html>
          <html lang="he" dir="rtl">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>תרגילים — מחולל תרגילי מתמטיקה</title>
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
            <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
            <style>
              *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{font-family:"Segoe UI",Arial,sans-serif;background:#f5f6fa;color:#1a1a2e;direction:rtl;min-height:100vh}.app-header{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);color:#e2e2e2;padding:18px 28px;display:flex;align-items:center;gap:14px}.app-header h1{font-size:1.4rem;font-weight:700;color:#fff}.app-header .subtitle{font-size:.82rem;color:#8892b0}.grade-badge{background:#e63946;color:#fff;border-radius:20px;padding:3px 12px;font-size:.78rem;font-weight:700;margin-right:auto}main{max-width:860px;margin:0 auto;padding:28px 20px 60px}.controls-card,.question-card{background:#fff;border-radius:14px;box-shadow:0 2px 16px rgba(0,0,0,.09)}.controls-card{padding:22px 24px;margin-bottom:24px}.controls-card h2{font-size:1rem;margin-bottom:16px;color:#16213e}.controls-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:18px}.ctrl-group label{display:block;font-size:.8rem;font-weight:600;color:#555;margin-bottom:6px}.ctrl-group select{width:100%;border:1.5px solid #dde2ef;border-radius:8px;padding:8px 10px;font-size:.9rem;font-family:inherit;direction:rtl;background:#fafbff;color:#1a1a2e}.btn-generate{background:linear-gradient(135deg,#4361ee,#3a0ca3);color:#fff;border:none;border-radius:10px;padding:11px 28px;font-size:1rem;font-weight:700;cursor:pointer}.question-card{padding:28px 28px 22px;margin-bottom:18px}.q-meta{font-size:.75rem;color:#8892b0;margin-bottom:12px;display:flex;gap:10px;flex-wrap:wrap}.tag{background:#edf2ff;color:#4361ee;border-radius:20px;padding:2px 10px;font-weight:600}.question-text{font-size:1.05rem;line-height:1.75;margin-bottom:18px}.diagram-wrap{display:flex;justify-content:center;margin:14px 0 20px}.diagram-wrap svg{max-width:260px;height:auto}.answer-toggle{background:none;border:1.5px solid #dde2ef;border-radius:8px;padding:8px 16px;font-size:.88rem;cursor:pointer;color:#4361ee;font-weight:600;margin-bottom:12px;direction:rtl}.answer-section{background:#f0fdf4;border-radius:8px;padding:14px 16px;font-size:.95rem;color:#166534;line-height:1.7;display:none}.answer-section.visible{display:block}.export-bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid #eee}.btn-export{background:#f0f4ff;color:#4361ee;border:1.5px solid #c7d2fe;border-radius:8px;padding:7px 16px;font-size:.82rem;font-weight:600;cursor:pointer}.export-status{font-size:.78rem;color:#555;align-self:center}.grade9-notice{background:#fff7ed;border:1.5px solid #fed7aa;border-radius:10px;padding:14px 18px;font-size:.88rem;color:#9a3412;line-height:1.6;display:none}.empty-state{text-align:center;color:#8892b0;padding:40px 0;font-size:.95rem}@media print{body{background:#fff}.controls-card,.app-header,.export-bar,.answer-toggle,.btn-generate{display:none!important}.question-card{box-shadow:none;border:1px solid #ccc}.answer-section{display:block!important}main{padding:0;max-width:100%}}
            </style>
          </head>
          <body>
          <header class="app-header"><div><h1>תרגילים</h1><div class="subtitle">מחולל תרגילי מתמטיקה לכיתות ז׳–ח׳</div></div><span class="grade-badge" id="gradeBadge">כיתה ז׳</span></header>
          <main>
            <div class="controls-card"><h2>הגדרות תרגיל</h2><div class="controls-grid"><div class="ctrl-group"><label for="selGrade">כיתה</label><select id="selGrade" onchange="onGradeChange()"><option value="7">כיתה ז׳</option><option value="8">כיתה ח׳</option><option value="9">כיתה ט׳</option></select></div><div class="ctrl-group"><label for="selDomain">תחום</label><select id="selDomain" onchange="onDomainChange()"><option value="geometry">גאומטריה</option><option value="algebra">אלגברה</option><option value="numeric">מספרים</option><option value="uncertainty">אי-ודאות</option></select></div><div class="ctrl-group"><label for="selTopic">נושא</label><select id="selTopic"></select></div><div class="ctrl-group"><label for="selDifficulty">רמה</label><select id="selDifficulty"><option value="standard">סטנדרטית</option><option value="challenge">מאתגרת</option></select></div></div><button class="btn-generate" onclick="generateQuestion()">צור תרגיל</button></div>
            <div class="grade9-notice" id="grade9Notice"><strong>כיתה ט׳ — טרם נבנו תרגילים.</strong><br>קיים מקור תוכנית לימודים לפי ההנדאוף, אך יש צורך בדוגמאות ובתבניות לפני יצירת תרגילים.</div>
            <div id="outputArea"><div class="empty-state">בחרו כיתה, תחום ונושא — ולחצו על ״צור תרגיל״</div></div>
          </main>
          <script>
          const TOPICS={7:{geometry:[{id:"G7-03",label:"משפט פיתגורס — מציאת צלע",hasGenerator:true}],algebra:[{id:"A7-01",label:"ביטויים אלגבריים — בפיתוח",hasGenerator:false}],numeric:[{id:"N7-06",label:"חזקות — בפיתוח",hasGenerator:false}],uncertainty:[{id:"U7-01",label:"טבלת תדירות — בפיתוח",hasGenerator:false}]},8:{geometry:[{id:"G8-01",label:"עיגול — בפיתוח",hasGenerator:false}],algebra:[{id:"A8-02",label:"שיפוע קו ישר — בפיתוח",hasGenerator:false}],numeric:[{id:"N8-04",label:"אחוזים — בפיתוח",hasGenerator:false}],uncertainty:[{id:"U8-01",label:"מדדי מרכז ופיזור — בפיתוח",hasGenerator:false}]},9:{geometry:[{id:"G9-01",label:"גאומטריה דדוקטיבית — דורש תבניות ודוגמאות",hasGenerator:false}],algebra:[{id:"A9-02",label:"פונקציות ריבועיות — דורש תבניות ודוגמאות",hasGenerator:false}],numeric:[],uncertainty:[]}};
          const PYTH_TRIPLES=[[3,4,5],[5,12,13],[6,8,10],[8,15,17],[9,12,15],[10,24,26],[7,24,25],[20,21,29]];
          function onGradeChange(){const g=+document.getElementById('selGrade').value;document.getElementById('gradeBadge').textContent=`כיתה ${g===7?'ז׳':g===8?'ח׳':'ט׳'}`;document.getElementById('grade9Notice').style.display=g===9?'block':'none';onDomainChange()}function onDomainChange(){const g=+document.getElementById('selGrade').value,d=document.getElementById('selDomain').value,sel=document.getElementById('selTopic');sel.innerHTML='';((TOPICS[g]||{})[d]||[]).forEach(t=>{const o=document.createElement('option');o.value=t.id;o.textContent=t.label+(t.hasGenerator?'':' — לא פעיל עדיין');sel.appendChild(o)})}function getCurrentTopic(){const g=+document.getElementById('selGrade').value,d=document.getElementById('selDomain').value,id=document.getElementById('selTopic').value;return((TOPICS[g]||{})[d]||[]).find(t=>t.id===id)}
          function generateQuestion(){const topic=getCurrentTopic();if(!topic)return;if(!topic.hasGenerator){showNotImplemented(topic);return}if(topic.id==='G7-03')generatePythagoras()}function showNotImplemented(topic){document.getElementById('outputArea').innerHTML=`<div class="question-card"><div class="q-meta"><span class="tag">בפיתוח</span><span>${topic.id}</span></div><div class="question-text">הנושא <strong>${topic.label}</strong> עדיין לא ממומש. אין כאן דמו ואין יצירת תרגיל מזויפת.</div></div>`}
          function generatePythagoras(){const diff=document.getElementById('selDifficulty').value,[a,b,c]=PYTH_TRIPLES[Math.floor(Math.random()*PYTH_TRIPLES.length)],unknown=diff==='challenge'?(Math.random()<.5?'a':'b'):['a','b','c'][Math.floor(Math.random()*3)];let questionText,answerText,svgDiagram;if(unknown==='c'){questionText=`במשולש ישר-זוויות, שתי הרגליים הן $${a}$ ס״מ ו-$${b}$ ס״מ. חשבו את אורך היתר.`;answerText=`לפי משפט פיתגורס: $${a}^2+${b}^2=c^2$<br>$${a*a}+${b*b}=c^2$<br>$c=\\sqrt{${c*c}}=${c}$<br>אורך היתר הוא $${c}$ ס״מ.`;svgDiagram=buildRightTriangleSVG(a,b,null)}else if(unknown==='a'){questionText=`במשולש ישר-זוויות, היתר הוא $${c}$ ס״מ ורגל אחת היא $${b}$ ס״מ. חשבו את אורך הרגל השנייה.`;answerText=`לפי משפט פיתגורס: $a^2+${b}^2=${c}^2$<br>$a^2=${c*c}-${b*b}=${a*a}$<br>$a=\\sqrt{${a*a}}=${a}$<br>אורך הרגל השנייה הוא $${a}$ ס״מ.`;svgDiagram=buildRightTriangleSVG(null,b,c)}else{questionText=`במשולש ישר-זוויות, היתר הוא $${c}$ ס״מ ורגל אחת היא $${a}$ ס״מ. חשבו את אורך הרגל השנייה.`;answerText=`לפי משפט פיתגורס: $${a}^2+b^2=${c}^2$<br>$b^2=${c*c}-${a*a}=${b*b}$<br>$b=\\sqrt{${b*b}}=${b}$<br>אורך הרגל השנייה הוא $${b}$ ס״מ.`;svgDiagram=buildRightTriangleSVG(a,null,c)}const cardId='qcard-'+Date.now(),ansId='ans-'+Date.now();document.getElementById('outputArea').innerHTML=`<div class="question-card" id="${cardId}"><div class="q-meta"><span class="tag">כיתה ז׳</span><span class="tag">גאומטריה</span><span class="tag">G7-03</span><span>משפט פיתגורס</span></div><div class="diagram-wrap">${svgDiagram}</div><div class="question-text">${questionText}</div><button class="answer-toggle" onclick="toggleAnswer('${ansId}')">הצג פתרון</button><div class="answer-section" id="${ansId}">${answerText}</div><div class="export-bar"><button class="btn-export" onclick="copyAsImage('${cardId}',this)">העתק כתמונה</button><button class="btn-export" onclick="downloadPNG('${cardId}',this)">הורד PNG</button><button class="btn-export" onclick="window.print()">הדפס</button><span class="export-status" id="status-${cardId}"></span></div></div>`;renderMathInElement(document.getElementById(cardId),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false})}
          function buildRightTriangleSVG(legA,legB,hyp){const W=220,H=160,pad=30,bx=pad,by=H-pad,cx=W-pad,cy=H-pad,ax=pad,ay=pad+10,labelA=legA!==null?`${legA} ס״מ`:'?',labelB=legB!==null?`${legB} ס״מ`:'?',labelC=hyp!==null?`${hyp} ס״מ`:'?';return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="משולש ישר-זוויות"><polygon points="${ax},${ay} ${bx},${by} ${cx},${cy}" fill="#edf2ff" stroke="#4361ee" stroke-width="2" stroke-linejoin="round"/><polyline points="${bx+10},${by} ${bx+10},${by-10} ${bx},${by-10}" fill="none" stroke="#4361ee" stroke-width="1.5"/><text x="${bx-18}" y="${(ay+by)/2+5}" font-size="13" fill="#1a1a2e" text-anchor="middle">${labelA}</text><text x="${(bx+cx)/2}" y="${by+18}" font-size="13" fill="#1a1a2e" text-anchor="middle">${labelB}</text><text x="${(ax+cx)/2+18}" y="${(ay+cy)/2-8}" font-size="13" fill="#e63946" text-anchor="middle" transform="rotate(-38 ${(ax+cx)/2+18} ${(ay+cy)/2-8})">${labelC}</text><text x="${ax-8}" y="${ay-4}" font-size="11" fill="#8892b0">A</text><text x="${bx-14}" y="${by+4}" font-size="11" fill="#8892b0">B</text><text x="${cx+4}" y="${cy+4}" font-size="11" fill="#8892b0">C</text></svg>`}
          async function copyAsImage(cardId,btn){const el=document.getElementById(cardId),statusEl=document.getElementById('status-'+cardId);btn.disabled=true;statusEl.textContent='מכין תמונה...';try{const canvas=await html2canvas(el,{scale:2,useCORS:false,backgroundColor:'#ffffff',logging:false});try{const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);statusEl.textContent='הועתק ללוח'}catch{downloadCanvasAsPNG(canvas,'targilim-question.png');statusEl.textContent='הורד PNG — הדפדפן חסם העתקה'}}catch(e){statusEl.textContent='שגיאה בייצוא'}btn.disabled=false}async function downloadPNG(cardId,btn){const canvas=await html2canvas(document.getElementById(cardId),{scale:2,backgroundColor:'#ffffff',logging:false});downloadCanvasAsPNG(canvas,'targilim-question.png')}function downloadCanvasAsPNG(canvas,filename){const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download=filename;a.click()}function toggleAnswer(ansId){const el=document.getElementById(ansId),v=el.classList.contains('visible');el.classList.toggle('visible');el.previousElementSibling.textContent=v?'הצג פתרון':'הסתר פתרון'}const Analytics={questionGenerated:()=>{},copyAsImageUsed:()=>{},downloadUsed:()=>{},printUsed:()=>{}};onDomainChange();
          </script>
