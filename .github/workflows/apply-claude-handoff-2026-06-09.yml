          {"domain":"numeric","grade":7,"source_files":["05_grade-7_numeric_domain_curriculum.pdf","07_numeric_domain_principles_grades-7-8.pdf","00_official_curriculum_7_9"],"topics":[{"id":"N7-01","name":"מערכת צירים — רביע I","hours":5,"pattern_ids":["N7-01","N7-02"],"visual":"coordinate_system_q1"},{"id":"N7-02","name":"מספרים שליליים ונגדיים","hours":5,"pattern_ids":["N7-03"],"visual":"number_line"},{"id":"N7-03","name":"חיבור וחיסור מכוונים","hours":7,"pattern_ids":["N7-04"],"visual":"number_line"},{"id":"N7-04","name":"כפל וחילוק מכוונים","hours":8,"pattern_ids":["N7-05"],"visual":"none"},{"id":"N7-05","name":"חזקות — (−a)ⁿ לעומת −aⁿ","hours":5,"pattern_ids":["N7-06"],"visual":"none","critical":"(-3)²=9 vs -3²=-9"},{"id":"N7-06","name":"שורש ריבועי","hours":4,"pattern_ids":["N7-07"],"visual":"none","perfect_squares":[1,4,9,16,25,36,49,64,81,100,121,144]},{"id":"N7-07","name":"מערכת צירים — 4 רביעים","hours":5,"pattern_ids":["N7-01"],"visual":"coordinate_system_full"},{"id":"N7-08","name":"חוקי חשבון וחוק הפילוג","hours":10,"visual":"none","note":"official_curriculum_round_1"}]}
