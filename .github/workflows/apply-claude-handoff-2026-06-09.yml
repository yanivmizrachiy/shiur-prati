name: Apply Claude handoff 2026-06-09

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-claude-handoff-2026-06-09
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Stop if already applied
        run: |
          if [ -f docs/CHATGPT_EXECUTION_REPORT_2026-06-09.md ]; then
            echo "Claude handoff already applied. Exiting."
            exit 0
          fi

      - name: Archive legacy shiur-prati files
        shell: bash
        run: |
          set -e
          ARCHIVE="archive/legacy-shiur-prati/2026-06-09"
          mkdir -p "$ARCHIVE/assets" "$ARCHIVE/data"
          move_if_exists() {
            src="$1"
            dst="$2"
            if [ -e "$src" ]; then
              mkdir -p "$(dirname "$dst")"
              git mv "$src" "$dst"
              echo "ARCHIVED: $src -> $dst"
            else
              echo "SKIPPED_NOT_FOUND: $src"
            fi
          }
          move_if_exists "index.html" "$ARCHIVE/index.html"
          move_if_exists "app.js" "$ARCHIVE/app.js"
          move_if_exists "styles.css" "$ARCHIVE/styles.css"
          move_if_exists "sw.js" "$ARCHIVE/sw.js"
          move_if_exists "manifest.webmanifest" "$ARCHIVE/manifest.webmanifest"
          move_if_exists "assistant-sync.html" "$ARCHIVE/assistant-sync.html"
          move_if_exists "auto-save.html" "$ARCHIVE/auto-save.html"
          move_if_exists "auto-update.html" "$ARCHIVE/auto-update.html"
          move_if_exists "payment-save.html" "$ARCHIVE/payment-save.html"
          move_if_exists "planned-save.html" "$ARCHIVE/planned-save.html"
          move_if_exists "today.html" "$ARCHIVE/today.html"
          move_if_exists "quick-add.js" "$ARCHIVE/quick-add.js"
          move_if_exists "assets/icon.svg" "$ARCHIVE/assets/icon.svg"
          move_if_exists "data/lesson-appointments.json" "$ARCHIVE/data/lesson-appointments.json"

      - name: Create/update executable handoff files
        shell: bash
        run: |
          set -e
          mkdir -p .github/workflows sources/official knowledge-base/grade-7 knowledge-base/grade-8 knowledge-base/grade-9 generator docs

          cat > .github/workflows/deploy-pages.yml <<'EOF'
          name: Deploy targilim to GitHub Pages
          on:
            push:
              branches: [main]
            workflow_dispatch:
          permissions:
            contents: read
            pages: write
            id-token: write
          concurrency:
            group: pages
            cancel-in-progress: true
          jobs:
            deploy:
              environment:
                name: github-pages
                url: ${{ steps.deployment.outputs.page_url }}
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - name: Verify generator exists
                  run: test -f generator/index.html || (echo "generator/index.html missing" && exit 1)
                - uses: actions/configure-pages@v5
                - uses: actions/upload-pages-artifact@v3
                  with:
                    path: "generator"
                - id: deployment
                  uses: actions/deploy-pages@v4
          EOF

          cat > PROJECT_STATUS.md <<'EOF'
          # Project Status — Targilim תרגילים
          **Last updated:** 2026-06-09

          ## Phase status
          | Phase | Status |
          |---|---|
          | 10 source PDFs uploaded | ✅ verified |
          | Official curriculum (math_7_9.pdf) learned | ⚠️ claimed by Claude; source file itself not uploaded by this handoff |
          | Phase 1: Audit + source learning | ⚠️ partial in GitHub; full source-learning file contents were not provided in the handoff |
          | Phase 2: Archive + KB + generator slice | ⚠️ partially applied from Claude handoff; needs browser/testing verification |
          | Grade 9 content | ⚠️ unblocked only if official source is later added/verified |
          | Grade 9 generator | 🔲 Needs example questions from source |
          | Copy-as-image | ⚠️ Architecture ready in generator file, needs browser testing |
          | Analytics | 🔲 Deferred — interface defined, no real tracking |

          ## Working generator slices
          | Topic | ID | Status |
          |---|---|---|
          | Pythagoras — find missing side | G7-03 | ⚠️ Code created from handoff; browser verification still required |
          | All others | various | ◦ Not yet implemented |

          ## Sources learned
          - Files 01–10: uploaded and verified earlier.
          - Official MoE curriculum URL documented in `sources/official/SOURCE_REFERENCE.md`.
          - The actual `math_7_9.pdf` file was not provided in this executable handoff.

          ## Key findings from Claude handoff
          - Functions start in grade 7 according to Claude handoff.
          - Probability also appears in grade 7 according to Claude handoff.
          - Formal algebraic exponent laws: grade 9 only according to Claude handoff.
          - Formal deductive proofs: grade 9 only according to Claude handoff.
          - Triangle similarity moved to grade 8 according to Claude handoff.

          ## Toolchain decisions from Claude handoff
          | Tool | Decision | Reason |
          |---|---|---|
          | Math rendering | KaTeX | Synchronous, html2canvas compatible |
          | Diagrams | SVG manual | Full control, no dependencies |
          | Copy-as-image | html2canvas + PNG fallback | Clipboard API fallback |
          | Hosting | GitHub Pages (generator/ folder) | Free, CDN |
          | Analytics | Deferred | No paid services before MVP |
          EOF

          cat > sources/official/SOURCE_REFERENCE.md <<'EOF'
          # Official Curriculum Source Reference

          ## Document
          תוכנית הלימודים במתמטיקה לכיתות ז-ט
          משרד החינוך, המזכירות הפדגוגית, אגף א' מדעים

          ## URL
          https://meyda.education.gov.il/files/Curriculum/math_7_9.pdf

          ## Status
          - URL documented on 2026-06-09.
          - Claude reported that the full text was read and analyzed.
          - The actual PDF file was not included in the executable handoff.
          - Deep learning note content was not included in the executable handoff.

          ## Importance
          This is intended to be the authoritative source for the entire project.
          All other source files (01-10) must be cross-referenced against this document after the actual file and learning notes are available and verified.
          EOF

