name: Verify Targilim Deep

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feat/source-bible-variety-dedicated-engines
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-deep:
    name: npm run verify:deep
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Print runtime versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install

      - name: Run deep verification gate
        run: npm run verify:deep
