name: Apply U8-01 generator slice

# Retrigger: 2026-06-10T04:18Z

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-u8-01-slice.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-u8-01:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply U8-01 patch
        run: |
          node <<'EOF'
          const fs = require('fs');

          function replaceOnce(file, find, replace, label) {
            let text = fs.readFileSync(file, 'utf8');
            if (!text.includes(find)) {
              throw new Error(`Missing target for ${label}: ${find}`);
            }
            text = text.replace(find, replace);
            fs.writeFileSync(file, text, 'utf8');
          }

          const generator = 'generator/index.html';

          replaceOnce(
            generator,
            '.tag.alg{background:#ede9fe;color:#5b21b6}',
            '.tag.alg{background:#ede9fe;color:#5b21b6}.tag.unc{background:#e0f2fe;color:#075985}',
            'add uncertainty tag css'
          );

          replaceOnce(
            generator,
            'id:"U8-01",label:"ממוצע, חציון, טווח",has:false',
            'id:"U8-01",label:"ממוצע, חציון, טווח",has:true',
            'activate U8-01'
          );

          replaceOnce(
            generator,
            "if(t.id==='A7-03')genEquation()",
            "if(t.id==='A7-03')genEquation();if(t.id==='U8-01')genStats()",
            'route U8-01 generation'
          );

          replaceOnce(
            generator,
            "function genEquation(){",
            String.raw`function genStats(){const datasets=[[72,85,90,68,85,77,92,85,73,80],[55,60,72,60,88,91,60,74,83,67],[45,50,62,78,50,84,91,50,73,67],[30,45,45,52,67,45,71,88,92,65],[12,18,24,18,31,18,42,37,29,51]],raw=datasets[Math.floor(Math.random()*datasets.length)],sorted=[...raw].sort((a,b)=>a-b),n=raw.length,sum=raw.reduce((a,b)=>a+b,0),mean=Math.round(sum/n*10)/10,mid1=sorted[n/2-1],mid2=sorted[n/2],median=(mid1+mid2)/2,range=sorted[n-1]-sorted[0];const qtext=`לפניכם ציוני ${n} תלמידים במבחן:\n$${raw.join(', ')}$\nא. חשבו את הממוצע.\nב. מצאו את החציון.\nג. חשבו את הטווח.`;const atext=`א. ממוצע:\n$$\\frac{${raw.join('+')}}{${n}}=\\frac{${sum}}{${n}}=${mean}$$\nב. חציון — קודם ממיינים: $${sorted.join(', ')}$\nיש ${n} ערכים, לכן החציון הוא ממוצע שני הערכים האמצעיים:\n$$\\frac{${mid1}+${mid2}}{2}=${median}$$\nג. טווח:\n$$${sorted[n-1]}-${sorted[0]}=${range}$$`;renderCard('U8-01','ממוצע, חציון וטווח','',qtext,atext,'unc')}
function genEquation(){`,
            'insert genStats'
          );

          replaceOnce(
            generator,
            "domainLabel=tagClass==='num'?'מספרי':tagClass==='alg'?'אלגברי':'גאומטריה'",
            "domainLabel=tagClass==='num'?'מספרי':tagClass==='alg'?'אלגברי':tagClass==='unc'?'אי-ודאות':'גאומטריה'",
            'renderCard uncertainty label'
          );

          const workflow = '.github/workflows/verify-generator-slices.yml';
          replaceOnce(
            workflow,
            "{id:'A7-03', domain:'algebra', re:/משוואה|פתרון|בדיקה|x/, needsSvg:false}",
            "{id:'A7-03', domain:'algebra', re:/משוואה|פתרון|בדיקה|x/, needsSvg:false},\n            {id:'U8-01', domain:'uncertainty', re:/ממוצע|חציון|טווח/, needsSvg:false}",
            'verify U8-01'
          );

          replaceOnce(
            workflow,
            "GENERATOR_SLICES_G7_03_G7_04_N7_06_A7_03_OK",
            "GENERATOR_SLICES_G7_03_G7_04_N7_06_A7_03_U8_01_OK",
            'verification console message'
          );
          EOF

      - name: Commit U8-01 patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generator/index.html .github/workflows/verify-generator-slices.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "feat: add U8-01 mean median range generator slice"
            git push
          fi
