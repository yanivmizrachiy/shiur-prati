name: Verify generator slices

on:
  push:
    branches: [main]
    paths:
      - "generator/index.html"
      - ".github/workflows/verify-generator-slices.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: |
          npm init -y
          npm i -D playwright
          npx playwright install chromium --with-deps
      - run: |
          cat > verify.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch();
          const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
          const errors = [];
          page.on('pageerror', e => errors.push(e.message));
          page.on('console', m => { if (m.type() === 'error') errors.push(m.text()); });
          await page.goto('https://yanivmizrachiy.github.io/targilim/', { waitUntil: 'networkidle', timeout: 60000 });
          await page.waitForSelector('text=תרגילים');
          const checks = [
            {id:'G7-03', domain:'geometry', re:/משולש|יתר|רגל/, needsSvg:true},
            {id:'G7-04', domain:'geometry', re:/זוויות|∠|180/, needsSvg:true},
            {id:'N7-06', domain:'numeric', re:/חזקות|סוגריים|בסיס|חזקה/, needsSvg:false},
            {id:'A7-03', domain:'algebra', re:/משוואה|פתרון|בדיקה|x/, needsSvg:false}
          ];
          for (const item of checks) {
            await page.selectOption('#sg','7');
            await page.selectOption('#sd',item.domain);
            await page.selectOption('#st',item.id);
            await page.click('.btn-gen');
            await page.waitForSelector('.qcard');
            const q = await page.locator('.qtext').innerText();
            await page.click('.btn-ans');
            await page.waitForSelector('.answer.open');
            const a = await page.locator('.answer.open').innerText();
            const buttons = await page.locator('.btn-exp').count();
            if (buttons < 3) throw new Error(item.id + ' export buttons missing');
            if (!item.re.test(q+a)) throw new Error(item.id + ' wording failed: ' + q + ' / ' + a);
            if (item.needsSvg) await page.waitForSelector('.qcard svg');
          }
          if (errors.length) throw new Error(errors.join(' | '));
          await browser.close();
          console.log('GENERATOR_SLICES_G7_03_G7_04_N7_06_A7_03_OK');
          EOF
          node verify.mjs
