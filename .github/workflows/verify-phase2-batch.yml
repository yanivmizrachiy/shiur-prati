name: Verify Phase 2 — Full Browser Batch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "generator/**"
      - ".github/workflows/verify-phase2-batch.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm init -y
          npm i -D playwright
          npx playwright install chromium --with-deps

      - name: Wait for Pages deployment
        run: |
          set -euo pipefail
          URL="https://yanivmizrachiy.github.io/targilim/site-health.json"
          for i in $(seq 1 12); do
            STATUS=$(curl -L -s -o /tmp/site-health.json -w "%{http_code}" "$URL" || true)
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              grep -q '"status": "ok"' /tmp/site-health.json
              grep -q '"activeSlices": 25' /tmp/site-health.json
              echo "PAGES_STATIC_HEALTH_READY"
              exit 0
            fi
            sleep 15
          done
          echo "Pages static health endpoint not available after 3 minutes"
          cat /tmp/site-health.json | head -80 || true
          exit 1

      - name: Run browser batch verification
        run: |
          cat > verify-phase2.mjs <<'EOF'
          import { chromium } from 'playwright';

          const url = 'https://yanivmizrachiy.github.io/targilim/?verify=phase2-full-batch';
          const checks = [
            ['7','geometry','G7-01'], ['7','geometry','G7-02'], ['7','geometry','G7-03'], ['7','geometry','G7-04'],
            ['7','numeric','N7-03'], ['7','numeric','N7-04'], ['7','numeric','N7-05'], ['7','numeric','N7-06'], ['7','numeric','N7-07'],
            ['7','algebra','A7-01'], ['7','algebra','A7-02'], ['7','algebra','A7-03'],
            ['7','uncertainty','U7-01'], ['7','uncertainty','U7-02'],
            ['8','geometry','G8-01'], ['8','geometry','G8-04'],
            ['8','numeric','N8-01'], ['8','numeric','N8-02'], ['8','numeric','N8-03'], ['8','numeric','N8-04'], ['8','numeric','N8-05'],
            ['8','algebra','A8-02'], ['8','algebra','A8-03'],
            ['8','uncertainty','U8-01'], ['8','uncertainty','U8-02']
          ];

          // G8-04 is intentionally text-only for now; do not require SVG there.
          const svgRequired = new Set(['G7-01','G7-02','G7-03','G7-04','G8-01']);
          const browser = await chromium.launch();
          const page = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 2, isMobile: true });
          const errors = [];
          const results = [];

          page.on('pageerror', e => errors.push(e.message));
          page.on('console', m => {
            const text = m.text();
            if (m.type() === 'error' && /TypeError|ReferenceError|SyntaxError/.test(text)) errors.push(text);
          });

          const response = await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 });
          const status = response ? response.status() : 0;
          if (status === 403 || status === 404) throw new Error('GitHub Pages not deployed or inaccessible: HTTP ' + status);
          if (status < 200 || status >= 400) throw new Error('Unexpected Pages HTTP status: ' + status);

          await page.waitForSelector('text=תרגילים', { timeout: 30000 });
          await page.waitForFunction(() => {
            return typeof TOPICS !== 'undefined' &&
              TOPICS[7]?.numeric?.some(t => t[0] === 'N7-04') &&
              TOPICS[8]?.algebra?.some(t => t[0] === 'A8-03');
          }, null, { timeout: 30000 });

          for (const [grade, domain, id] of checks) {
            try {
              await page.selectOption('#sg', grade);
              await page.selectOption('#sd', domain);
              await page.waitForFunction((expectedId) => [...document.querySelectorAll('#st option')].some(o => o.value === expectedId), id, { timeout: 15000 });

              const vals = await page.$$eval('#st option', opts => opts.map(o => o.value));
              if (!vals.includes(id)) throw new Error(id + ' missing from selector: ' + vals.join(','));

              await page.selectOption('#st', id);
              await page.click('.btn-gen');
              await page.waitForSelector('.qcard', { timeout: 10000 });

              const qtext = await page.locator('.qtext').innerText({ timeout: 10000 });
              if (!qtext || qtext.trim().length < 3) throw new Error(id + ' generated empty qtext');

              await page.click('.btn-ans');
              await page.waitForSelector('.answer.open', { timeout: 10000 });
              const answer = await page.locator('.answer').innerText({ timeout: 10000 });
              if (!answer || answer.trim().length < 2) throw new Error(id + ' answer empty');

              const buttons = await page.locator('.btn-exp').count();
              if (buttons < 3) throw new Error(id + ' export buttons missing: ' + buttons);

              if (svgRequired.has(id)) {
                const svgCount = await page.locator('.qcard svg').count();
                if (svgCount < 1) throw new Error(id + ' expected SVG but none found');
              }

              const hasHorizontalScroll = await page.evaluate(() => document.body.scrollWidth > window.innerWidth + 2);
              if (hasHorizontalScroll) throw new Error(id + ' horizontal scroll detected on mobile viewport');

              results.push({ id, status: 'PASS' });
              console.log('PASS ' + id);
            } catch (e) {
              results.push({ id, status: 'FAIL', error: e.message });
              console.log('FAIL ' + id + ': ' + e.message);
            }
          }

          await page.screenshot({ path: 'mobile-check.png', fullPage: false });
          await browser.close();

          const failed = results.filter(r => r.status === 'FAIL');
          const filteredErrors = errors.filter(e => !/favicon|fonts\.gstatic|ERR_BLOCKED_BY_CLIENT/.test(e));

          console.log('\n=== PHASE 2 BROWSER BATCH SUMMARY ===');
          console.log('PASS: ' + results.filter(r => r.status === 'PASS').length + '/' + checks.length);
          if (failed.length) console.log('FAILED: ' + failed.map(f => f.id + ': ' + f.error).join(' | '));
          if (filteredErrors.length) console.log('JS ERRORS: ' + filteredErrors.join(' | '));

          if (failed.length || filteredErrors.length) process.exit(1);
          console.log('PHASE_2_BROWSER_BATCH_25_25_AND_MOBILE_OK');
          EOF
          node verify-phase2.mjs

      - name: Upload mobile screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-screenshot
          path: mobile-check.png
          if-no-files-found: ignore
