name: Verify Phase 2 batch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "generator/**"
      - ".github/workflows/verify-phase2-batch.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: |
          npm init -y
          npm i -D playwright
          npx playwright install chromium --with-deps
      - run: |
          cat > verify-phase2.mjs <<'EOF'
          import { chromium } from 'playwright';
          const url = 'https://yanivmizrachiy.github.io/targilim/?verify=phase2';
          const checks = [
            ['7','geometry','G7-03'],['7','geometry','G7-04'],['7','geometry','G7-01'],['7','geometry','G7-02'],
            ['7','numeric','N7-03'],['7','numeric','N7-04'],['7','numeric','N7-05'],['7','numeric','N7-06'],['7','numeric','N7-07'],
            ['7','algebra','A7-01'],['7','algebra','A7-02'],['7','algebra','A7-03'],['7','uncertainty','U7-01'],['7','uncertainty','U7-02'],
            ['8','geometry','G8-01'],['8','geometry','G8-04'],['8','numeric','N8-01'],['8','numeric','N8-02'],['8','numeric','N8-03'],['8','numeric','N8-04'],['8','numeric','N8-05'],
            ['8','algebra','A8-02'],['8','algebra','A8-03'],['8','uncertainty','U8-01'],['8','uncertainty','U8-02']
          ];
          const browser = await chromium.launch();
          const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
          const errors = [];
          page.on('pageerror', e => errors.push(e.message));
          page.on('console', m => {
            if (m.type() === 'error' && /TypeError|ReferenceError|SyntaxError|Failed to load resource/.test(m.text())) errors.push(m.text());
          });
          const response = await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 });
          const status = response ? response.status() : 0;
          if (status === 403 || status === 404) throw new Error('GitHub Pages not deployed or inaccessible: HTTP ' + status);
          if (status < 200 || status >= 400) throw new Error('Unexpected Pages HTTP status: ' + status);
          await page.waitForSelector('text=תרגילים');
          await page.waitForFunction(() => window.TOPICS && TOPICS[7]?.numeric?.some(t => t[0] === 'N7-04') && TOPICS[8]?.algebra?.some(t => t[0] === 'A8-03'), null, { timeout: 30000 });
          for (const [grade, domain, id] of checks) {
            await page.selectOption('#sg', grade);
            await page.selectOption('#sd', domain);
            await page.waitForFunction((expectedId) => [...document.querySelectorAll('#st option')].some(o => o.value === expectedId), id, { timeout: 15000 });
            const vals = await page.$$eval('#st option', opts => opts.map(o => o.value));
            if (!vals.includes(id)) throw new Error(id + ' missing from selector: ' + vals.join(','));
            await page.selectOption('#st', id);
            await page.click('.btn-gen');
            await page.waitForSelector('.qcard');
            await page.click('.btn-ans');
            await page.waitForSelector('.answer.open');
            const buttons = await page.locator('.btn-exp').count();
            if (buttons < 3) throw new Error(id + ' export buttons missing');
            const text = await page.locator('.qcard').innerText();
            if (!text || text.length < 5) throw new Error(id + ' generated empty card');
            if (/^G/.test(id)) {
              const svgCount = await page.locator('.qcard svg').count();
              if (['G7-01','G7-02','G7-03','G7-04','G8-01'].includes(id) && svgCount < 1) throw new Error(id + ' expected SVG but none found');
            }
          }
          if (errors.length) throw new Error(errors.join(' | '));
          await browser.close();
          console.log('PHASE_2_BATCH_25_SLICES_ASYNC_LOADER_OK');
          EOF
          node verify-phase2.mjs
