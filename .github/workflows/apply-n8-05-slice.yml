name: Apply N8-05 dynamic percentages slice

# Retrigger: 2026-06-10T04:35Z

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-n8-05-slice.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-n8-05:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply N8-05 patch
        run: |
          node <<'EOF'
          const fs = require('fs');
          const file = 'generator/index.html';
          let text = fs.readFileSync(file, 'utf8');
          function once(find, replace, label) {
            if (!text.includes(find)) throw new Error('Missing target: ' + label + ' :: ' + find);
            text = text.replace(find, replace);
          }
          once("{id:'N8-05',label:'אחוזים — מצבים דינמיים',has:false}", "{id:'N8-05',label:'אחוזים — מצבים דינמיים',has:true}", 'activate N8-05');
          once("if(t.id==='N8-04')genPercentStatic()", "if(t.id==='N8-04')genPercentStatic();if(t.id==='N8-05')genPercentDynamic()", 'route N8-05');
          once("function genPercentStatic(){", String.raw`function genPercentDynamic(){const subtypes=['increase','decrease','find_original','two_changes'],sub=subtypes[Math.floor(Math.random()*subtypes.length)],items=[{name:'מוצר',unit:'₪'},{name:'כרטיס',unit:'₪'},{name:'שכר',unit:'₪/שעה'}],item=items[Math.floor(Math.random()*items.length)],bases=[40,50,60,80,100,120,150,200,250,400],pcts=[10,15,20,25,30,40,50],base=bases[Math.floor(Math.random()*bases.length)],pct=pcts[Math.floor(Math.random()*pcts.length)],factor=pct/100;let qtext,atext;if(sub==='increase'){const newVal=Math.round(base*(1+factor)*100)/100;qtext=\`מחיר ${item.name} הוא $${base}$ ${item.unit}.\nהמחיר עלה ב-$${pct}\\%$.\nמה המחיר החדש?\`;atext=\`הגדלה ב-$${pct}\\%$ פירושה כפל ב-$${1+factor}$.\n$$${base}\\times${1+factor}=${newVal}$$\nהמחיר החדש: $${newVal}$ ${item.unit}.\`}else if(sub==='decrease'){const newVal=Math.round(base*(1-factor)*100)/100;qtext=\`מחיר ${item.name} הוא $${base}$ ${item.unit}.\nהמחיר ירד ב-$${pct}\\%$.\nמה המחיר החדש?\`;atext=\`הקטנה ב-$${pct}\\%$ פירושה כפל ב-$${1-factor}$.\n$$${base}\\times${1-factor}=${newVal}$$\nהמחיר החדש: $${newVal}$ ${item.unit}.\`}else if(sub==='find_original'){const shown=Math.round(base*(1+factor)*100)/100;qtext=\`מחיר ${item.name} עלה ב-$${pct}\\%$ ועכשיו הוא $${shown}$ ${item.unit}.\nמה היה המחיר המקורי?\`;atext=\`המחיר החדש הוא $${1+factor}$ פעמים המחיר המקורי.\n$$\\frac{${shown}}{${1+factor}}=${base}$$\nהמחיר המקורי היה $${base}$ ${item.unit}.\`}else{let p2=pcts[Math.floor(Math.random()*pcts.length)];const after1=Math.round(base*(1+factor)*100)/100,after2=Math.round(after1*(1-p2/100)*100)/100,net=Math.round((after2/base-1)*1000)/10;qtext=\`מחיר ${item.name}: $${base}$ ${item.unit}.\nשלב א: עלה ב-$${pct}\\%$.\nשלב ב: ירד ב-$${p2}\\%$.\nא. מה המחיר הסופי?\nב. האם חזרנו למחיר המקורי? הסבירו.\`;atext=\`שלב א:\n$$${base}\\times${1+factor}=${after1}$$\nשלב ב:\n$$${after1}\\times${1-p2/100}=${after2}$$\nהמחיר הסופי: $${after2}$ ${item.unit}.\nלא בהכרח חוזרים למחיר המקורי, כי האחוז השני מחושב מתוך סכום אחר.\nשינוי כולל: $${net>0?'+':''}${net}\\%$ מהמקור.\`}renderCard('N8-05','אחוזים דינמיים','',qtext,atext,'num')}
function genPercentStatic(){`, 'insert genPercentDynamic');
          once("פעילים עכשיו: G7-03, G7-04, N7-06, A7-03, U8-01, N8-04.", "פעילים עכשיו: G7-03, G7-04, N7-06, A7-03, U8-01, N8-04, N8-05.", 'update wip text');
          once("gradeLabel=(id==='U8-01'||id==='N8-04')?'כיתה ח׳':'כיתה ז׳'", "gradeLabel=(id==='U8-01'||id==='N8-04'||id==='N8-05')?'כיתה ח׳':'כיתה ז׳'", 'grade label N8-05');
          fs.writeFileSync(file, text, 'utf8');
          EOF
      - name: Commit N8-05 patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generator/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "feat: add N8-05 dynamic percentages generator slice"
            git push
          fi
