name: Verify Phase 2 static structure

on:
  push:
    branches: [main]
    paths:
      - 'generator/**'
      - 'PROJECT_STATUS.md'
      - 'tools/verify-phase2-static.mjs'
      - '.github/workflows/verify-phase2-static.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify Phase 2 static structure
        run: node tools/verify-phase2-static.mjs
