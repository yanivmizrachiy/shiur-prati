name: Verify Phase 3A Engine

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'generator/**'
      - '.github/workflows/verify-phase3a.yml'

jobs:
  verify-phase3a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install browser test dependency
        run: npm install puppeteer

      - name: Wait for GitHub Pages
        run: |
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://yanivmizrachiy.github.io/targilim/")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "GitHub Pages did not return 200 in time"
          exit 1

      - name: Verify Phase 3A engine topics live
        run: |
          node - << 'NODEEOF'
          const puppeteer = require('puppeteer');
          const BASE = 'https://yanivmizrachiy.github.io/targilim/';

          async function wait(ms){ return new Promise(r => setTimeout(r, ms)); }

          (async () => {
            const browser = await puppeteer.launch({ args: ['--no-sandbox','--disable-setuid-sandbox'] });
            const page = await browser.newPage();
            await page.setViewport({ width: 390, height: 844, isMobile: true, deviceScaleFactor: 2 });

            const jsErrors = [];
            page.on('pageerror', e => jsErrors.push(e.message));
            page.on('console', m => {
              const text = m.text();
              if (m.type() === 'error' && /TypeError|ReferenceError|SyntaxError|Failed to load/i.test(text)) {
                jsErrors.push(text);
              }
            });

            await page.goto(BASE, { waitUntil: 'networkidle2', timeout: 45000 });
            await wait(1000);

            const engineReady = await page.evaluate(() => {
              return !!(window.TargilimEngine &&
                typeof window.TargilimEngine.generateG703Engine === 'function' &&
                typeof window.TargilimEngine.generateN803Engine === 'function' &&
                typeof window.TargilimEngine.generateN804Engine === 'function');
            });
            if (!engineReady) throw new Error('Phase 3A engine functions are not loaded');

            const engineTopics = [
              { grade: '7', domain: 'geometry', id: 'G7-03-ENGINE', needsSvg: true },
              { grade: '8', domain: 'numeric', id: 'N8-03-ENGINE', needsSvg: true },
              { grade: '8', domain: 'numeric', id: 'N8-04-ENGINE', needsSvg: false }
            ];
            const qtypes = ['open','mcq','tf','mistake'];
            const diffs = ['basic','standard','challenge'];

            for (const topic of engineTopics) {
              await page.select('#sg', topic.grade);
              await wait(200);
              await page.select('#sd', topic.domain);
              await wait(300);

              const exists = await page.$eval('#st', (sel, id) => Array.from(sel.options).some(o => o.value === id), topic.id);
              if (!exists) throw new Error(`${topic.id} not found in topic selector`);

              for (const diff of diffs) {
                for (const qtype of qtypes) {
                  await page.select('#st', topic.id);
                  await wait(100);
                  await page.select('#selDiff', diff);
                  await page.select('#selQType', qtype);
                  await page.click('.btn-gen');
                  await wait(700);

                  const cardExists = await page.$('.qcard');
                  if (!cardExists) throw new Error(`No qcard for ${topic.id} ${diff}/${qtype}`);

                  const text = await page.$eval('.qtext', e => e.textContent.trim());
                  if (!text || text.length < 3) throw new Error(`Empty qtext for ${topic.id} ${diff}/${qtype}`);

                  const answerButton = await page.$('.btn-ans');
                  if (!answerButton) throw new Error(`No answer button for ${topic.id} ${diff}/${qtype}`);
                  await answerButton.click();
                  await wait(200);
                  const ans = await page.$eval('.answer', e => e.textContent.trim());
                  if (!ans || ans.length < 2) throw new Error(`Empty answer for ${topic.id} ${diff}/${qtype}`);

                  const exports = await page.$$('.btn-exp');
                  if (exports.length < 3) throw new Error(`Missing export buttons for ${topic.id} ${diff}/${qtype}`);

                  if (topic.needsSvg) {
                    const svg = await page.$('.qcard svg');
                    if (!svg) throw new Error(`Missing SVG for ${topic.id} ${diff}/${qtype}`);
                  }

                  const scroll = await page.evaluate(() => document.body.scrollWidth > window.innerWidth + 2);
                  if (scroll) throw new Error(`Horizontal scroll for ${topic.id} ${diff}/${qtype}`);

                  console.log(`PASS ${topic.id} ${diff}/${qtype}`);
                }
              }
            }

            const legacyChecks = [
              { grade: '7', domain: 'geometry', id: 'G7-03' },
              { grade: '8', domain: 'numeric', id: 'N8-03' },
              { grade: '8', domain: 'numeric', id: 'N8-04' }
            ];
            for (const legacy of legacyChecks) {
              await page.select('#sg', legacy.grade);
              await wait(200);
              await page.select('#sd', legacy.domain);
              await wait(300);
              await page.select('#st', legacy.id);
              await page.click('.btn-gen');
              await wait(500);
              const text = await page.$eval('.qtext', e => e.textContent.trim());
              if (!text || text.length < 3) throw new Error(`Legacy topic broken: ${legacy.id}`);
              console.log(`PASS legacy ${legacy.id}`);
            }

            await page.select('#sg', '9');
            await wait(300);
            const g9Open = await page.$eval('#g9notice', e => e.classList.contains('open'));
            if (!g9Open) throw new Error('Grade 9 locked notice did not open');

            const filteredErrors = jsErrors.filter(e => !/favicon|fonts\.gstatic/i.test(e));
            if (filteredErrors.length) throw new Error('JS errors: ' + filteredErrors.join(' | '));

            await browser.close();
            console.log('Phase 3A engine verification PASS ✅');
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODEEOF
