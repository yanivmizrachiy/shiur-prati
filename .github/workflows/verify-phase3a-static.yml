name: Verify Phase 3A static audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'generator/**'
      - 'tools/verify-phase3a-static.mjs'
      - '.github/workflows/verify-phase3a-static.yml'
      - 'PROJECT_STATUS.md'
      - 'RULES.md'

jobs:
  verify-phase3a-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Phase 3A static engine audit
        run: node tools/verify-phase3a-static.mjs
