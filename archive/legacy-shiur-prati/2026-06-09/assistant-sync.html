<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff7a00">
<title>סנכרון חכם — שיעור פרטי</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
<header><div><div class="tag">ניהול פרטי</div><h1>סנכרון חכם</h1></div></header>
<main>
<section class="screen active">
<div class="hero"><h2>שמירה מקומית</h2><p id="status">ממתין לנתונים...</p></div>
<div id="result" class="card"></div>
<button id="openApp" class="primary full">פתח את האפליקציה</button>
<button id="openToday" class="soft full">פתח את היום</button>
</section>
</main>
</div>
<script>
(()=>{
const KEY='shiur_prati_v1';
const $=s=>document.querySelector(s);
const uid=p=>`${p}_${Date.now()}_${Math.random().toString(16).slice(2)}`;
const now=()=>new Date().toISOString();
const today=()=>new Date().toISOString().slice(0,10);
const money=n=>`${Number(n||0).toLocaleString('he-IL')} ₪`;
const num=v=>Number(String(v??'').replace(/[^0-9.]/g,''))||0;
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'{}');return{students:Array.isArray(d.students)?d.students:[],lessons:Array.isArray(d.lessons)?d.lessons:[],logs:Array.isArray(d.logs)?d.logs:[],payments:Array.isArray(d.payments)?d.payments:[]}}catch{return{students:[],lessons:[],logs:[],payments:[]}}}
function save(db){localStorage.setItem(KEY,JSON.stringify(db))}
function decode(v){const p=v+'='.repeat((4-v.length%4)%4);const b=atob(p.replace(/-/g,'+').replace(/_/g,'/'));const bytes=Uint8Array.from(b,c=>c.charCodeAt(0));return new TextDecoder('utf-8').decode(bytes)}
function normMethod(v){v=String(v||'').trim().toLowerCase();if(!v)return'';if(v.includes('ביט')||v==='bit')return'ביט';if(v.includes('מזומן')||v==='cash')return'מזומן';if(v.includes('צ׳ק')||v.includes("צ'ק")||v.includes('שיק')||v==='check'||v==='cheque')return'צ׳ק';return''}
function normReceipt(v){v=String(v||'').trim();if(v.includes('הוצאה')&&!v.includes('לא'))return'הוצאה קבלה';return'לא הוצאה קבלה'}
function getStudent(db,name,price=0){name=String(name||'').trim();let s=db.students.find(x=>(x.fullName||'').trim()===name);if(!s){s={studentId:uid('student'),fullName:name,phone:'',grade:'',defaultLessonPrice:Number(price||0),status:'פעיל',notes:'',createdAt:now(),updatedAt:now()};db.students.push(s)}return s}
function lessonExists(db,studentId,item){return db.lessons.some(l=>l.studentId===studentId&&l.lessonDate===item.date&&String(l.lessonTime||'')===String(item.time||'')&&Number(l.amountDue||0)===Number(item.amount||0)&&String(l.lessonStatus||'')===String(item.lessonStatus||'התקיים'))}
function addLesson(db,item){const name=String(item.student||item.name||'').trim();const amount=num(item.amount);const date=String(item.date||today()).trim();if(!name||!date||!amount)return{added:false,reason:'missing'};const st=getStudent(db,name,amount);const lessonStatus=item.status==='planned'||item.lessonStatus==='נקבע ועדיין לא התקיים'?'נקבע ועדיין לא התקיים':'התקיים';const receiptStatus=normReceipt(item.receiptStatus);const row={studentId:st.studentId,date,time:String(item.time||''),amount,lessonStatus};if(lessonExists(db,st.studentId,row))return{added:false,reason:'duplicate'};const paid=num(item.paid||0);db.lessons.push({lessonId:uid('lesson'),studentId:st.studentId,lessonDate:date,lessonTime:String(item.time||''),durationMinutes:num(item.duration),amountDue:amount,amountPaid:paid,amountUnpaid:Math.max(amount-paid,0),lessonStatus,receiptStatus,receiptNumber:String(item.receiptNumber||''),notes:String(item.notes||''),createdAt:now(),updatedAt:now()});return{added:true,amount}}
function applyPayment(db,studentId,amount){let remaining=amount,applied=0;const open=db.lessons.filter(l=>l.studentId===studentId&&l.lessonStatus==='התקיים'&&Math.max(num(l.amountDue)-num(l.amountPaid),0)>0).sort((a,b)=>String(a.lessonDate||'').localeCompare(String(b.lessonDate||''))||String(a.lessonTime||'').localeCompare(String(b.lessonTime||'')));for(const l of open){if(remaining<=0)break;const debt=Math.max(num(l.amountDue)-num(l.amountPaid),0);const add=Math.min(debt,remaining);l.amountPaid=num(l.amountPaid)+add;l.amountUnpaid=Math.max(num(l.amountDue)-num(l.amountPaid),0);l.updatedAt=now();applied+=add;remaining-=add}return{applied,remaining}}
function addPayment(db,item){const name=String(item.student||item.name||'').trim();const amount=num(item.amount);const method=normMethod(item.method);if(!name||!amount||!method)return{added:false,reason:'missing'};const st=getStudent(db,name,0);const token=String(item.paymentToken||item.token||'');if(token&&db.payments.some(p=>p.token===token))return{added:false,reason:'duplicate'};const receiptStatus=normReceipt(item.receiptStatus);const applied=applyPayment(db,st.studentId,amount);if(receiptStatus==='הוצאה קבלה'){db.lessons.filter(l=>l.studentId===st.studentId&&l.lessonStatus==='התקיים'&&Math.max(num(l.amountDue)-num(l.amountPaid),0)===0&&l.receiptStatus!=='הוצאה קבלה').forEach(l=>{l.receiptStatus='הוצאה קבלה';l.updatedAt=now()})}
db.payments.push({paymentId:uid('payment'),token,studentId:st.studentId,studentName:name,payerName:String(item.payerName||item.payer||''),paymentDate:String(item.date||today()),amount,method,appliedAmount:applied.applied,unappliedAmount:applied.remaining,receiptStatus,notes:String(item.notes||''),createdAt:now()});return{added:true,amount,applied:applied.applied,remaining:applied.remaining}}
function run(){const params=new URLSearchParams((location.hash||'').replace(/^#/,''));const encoded=params.get('data')||params.get('d')||'';if(!encoded){$('#status').textContent='לא התקבלו נתונים.';$('#result').innerHTML='<p>לא נשמר דבר.</p>';return}let payload;try{payload=JSON.parse(decode(encoded))}catch{$('#status').textContent='קישור לא תקין.';$('#result').innerHTML='<p>לא נשמר דבר.</p>';return}const token=String(payload.token||`sync-${Date.now()}`);const db=load();if(db.logs.some(x=>x.action==='assistant_sync'&&x.token===token)){ $('#status').textContent='הסנכרון הזה כבר בוצע.'; $('#result').innerHTML='<p>לא נוצרה כפילות.</p>'; return }
let lessonsAdded=0,lessonsSkipped=0,lessonDebt=0,paymentsAdded=0,paymentsSkipped=0,paymentTotal=0,appliedTotal=0,unappliedTotal=0;for(const l of (Array.isArray(payload.lessons)?payload.lessons:Array.isArray(payload.items)?payload.items:[])){const r=addLesson(db,l);if(r.added){lessonsAdded++;lessonDebt+=num(r.amount)}else lessonsSkipped++}for(const p of (Array.isArray(payload.payments)?payload.payments:[])){const r=addPayment(db,p);if(r.added){paymentsAdded++;paymentTotal+=num(r.amount);appliedTotal+=num(r.applied);unappliedTotal+=num(r.remaining)}else paymentsSkipped++}db.logs.push({id:uid('log'),time:now(),action:'assistant_sync',token,lessonsAdded,lessonsSkipped,paymentsAdded,paymentsSkipped,lessonDebt,paymentTotal,appliedTotal,unappliedTotal});save(db);$('#status').textContent='נשמר בדפדפן הזה.';$('#result').innerHTML=`<h3>סנכרון הסתיים</h3><p>שיעורים נוספו: ${lessonsAdded}</p><p>שיעורים דולגו: ${lessonsSkipped}</p><p>חוב שיעורים חדש: ${money(lessonDebt)}</p><p>תשלומים נוספו: ${paymentsAdded}</p><p>תשלומים דולגו: ${paymentsSkipped}</p><p>סך תשלומים: ${money(paymentTotal)}</p><p>נסגר מול חובות: ${money(appliedTotal)}</p><p>יתרה לא משויכת: ${money(unappliedTotal)}</p>`;alert(`סנכרון הסתיים: ${lessonsAdded} שיעורים, ${paymentsAdded} תשלומים.`)}
$('#openApp').onclick=()=>location.href='./?v=assistant-sync';
$('#openToday').onclick=()=>location.href='./today.html?v=assistant-sync';
run();
})();
</script>
</body>
</html>
